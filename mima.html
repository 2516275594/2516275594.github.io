<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10182d">
  <meta name="description" content="在线随机密码生成器，支持大小写字母、数字和可选特殊符号。">
  <title>随机密码生成器</title>
  <style>
    :root{color-scheme:light;--ink:#24324a;--muted:#718096;--line:rgba(94,119,157,.18);--blue:#527de8;--mint:#45bda9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 18px;display:grid;place-items:center;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#eef6ff 0%,#f6f2ff 48%,#e9fbf5 100%);position:relative;overflow-x:hidden}
    body::before,body::after{content:"";position:fixed;width:360px;height:360px;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;z-index:0;animation:float 14s ease-in-out infinite alternate}
    body::before{background:#c5d9ff;top:-150px;left:-130px}
    body::after{background:#b9f0df;right:-150px;bottom:-160px;animation-delay:-6s}
    @keyframes float{to{transform:translate3d(35px,28px,0) scale(1.08)}}
    .card{position:relative;z-index:1;width:min(620px,100%);padding:clamp(22px,5vw,40px);border:1px solid rgba(255,255,255,.85);border-radius:28px;background:rgba(255,255,255,.78);box-shadow:0 24px 70px rgba(77,101,145,.14);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .back{color:#5475c7;text-decoration:none;font-size:13px;font-weight:650}
    .back:hover{text-decoration:underline}
    .tag{padding:7px 11px;border:1px solid rgba(82,125,232,.18);border-radius:99px;color:#6680bd;background:#f1f5ff;font-size:11px;letter-spacing:.08em}
    h1{margin:24px 0 8px;font-size:clamp(28px,6vw,38px);letter-spacing:-.04em;color:#253653}
    .desc{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
    .output{display:flex;gap:10px;margin:28px 0 22px;padding:12px;border:1px solid rgba(82,125,232,.22);border-radius:17px;background:linear-gradient(120deg,#f3f6ff,#f1fbfa)}
    #password{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#30466d;font:650 16px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.02em}
    button{border:0;border-radius:12px;padding:12px 17px;font:600 14px inherit;cursor:pointer;transition:transform .18s,filter .18s,box-shadow .18s}
    button:hover{filter:brightness(1.04);transform:translateY(-1px)}
    button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
    .copy{flex:0 0 auto;color:white;background:linear-gradient(110deg,#6388ed,#4bbfae);box-shadow:0 6px 16px rgba(82,125,232,.2)}
    .field{margin:20px 0}
    .field-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .field label,.field-title{font-size:14px;font-weight:700;color:#34445f}
    .hint{color:#8794a9;font-size:12px}
    .length-row{display:flex;align-items:center;gap:10px}
    .length-row input[type=number]{width:76px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#f7f9fd;color:var(--ink);font:inherit}
    .generate{flex:1;color:white;background:linear-gradient(110deg,#6388ed,#4bbfae);box-shadow:0 7px 18px rgba(82,125,232,.16);white-space:nowrap}
    .options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .option{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:13px;background:rgba(247,250,255,.85);color:#52617a;font-size:13px;transition:border-color .2s,background .2s}
    .option:has(input:checked){border-color:rgba(82,125,232,.32);background:#f0f5ff}
    input[type=checkbox]{width:17px;height:17px;accent-color:#6388ed}
    #message{min-height:20px;margin:14px 0 0;color:#279b8b;font-size:12px;text-align:center}
    footer{margin-top:28px;color:#94a0b2;font-size:11px;text-align:center}
    @media(max-width:460px){.output{flex-direction:column}.copy{width:100%}.options{grid-template-columns:1fr}.length-row{gap:8px}.length-row .generate{padding:11px 10px;font-size:13px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="card">
    <div class="top"><a class="back" href="./">← 返回主页</a><span class="tag">SECURE PASSWORD</span></div>
    <h1>随机密码生成器</h1>
    <p class="desc">一键生成随机密码。默认包含小写字母、大写字母和数字，特殊符号可按需开启。</p>

    <div class="output">
      <input id="password" type="text" value="" readonly aria-label="生成的随机密码" spellcheck="false">
      <button class="copy" id="copyBtn" type="button">复制密码</button>
    </div>

    <div class="field">
      <div class="field-head"><label for="length">密码长度</label><span class="hint">建议至少 12 位</span></div>
      <div class="length-row"><input id="length" type="number" min="8" max="64" value="16" inputmode="numeric"><button class="generate" id="generateBtn" type="button">⟳ 生成新密码</button></div>
    </div>

    <div class="field">
      <div class="field-head"><span class="field-title">字符类型</span><span class="hint">默认组合</span></div>
      <div class="options">
        <label class="option"><input id="symbols" type="checkbox"> 特殊符号 (!@#$…)</label>
        <label class="option"><input type="checkbox" checked disabled> 小写字母 (a-z)</label>
        <label class="option"><input type="checkbox" checked disabled> 大写字母 (A-Z)</label>
        <label class="option"><input type="checkbox" checked disabled> 数字 (0-9)</label>
      </div>
    </div>

    <p id="message" role="status" aria-live="polite"></p>
    <footer>密码仅在当前浏览器本地生成，不会上传到服务器。</footer>
  </main>

  <script>
    const lower = "abcdefghijklmnopqrstuvwxyz";
    const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const digits = "0123456789";
    const symbols = "!@#$%^&*()-_=+[]{};:,.?";

    function secureIndex(max) {
      const limit = Math.floor(256 / max) * max;
      const bytes = new Uint8Array(1);
      do { crypto.getRandomValues(bytes); } while (bytes[0] >= limit);
      return bytes[0] % max;
    }

    function shuffle(items) {
      for (let i = items.length - 1; i > 0; i--) {
        const j = secureIndex(i + 1);
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    function generatePassword() {
      const lengthInput = document.getElementById("length");
      const length = Number.parseInt(lengthInput.value, 10);
      const message = document.getElementById("message");
      if (!Number.isInteger(length) || length < 8 || length > 64) {
        message.textContent = "请输入 8 到 64 之间的密码长度。";
        lengthInput.focus();
        return;
      }

      const pools = [lower, upper, digits];
      if (document.getElementById("symbols").checked) pools.push(symbols);
      if (length < pools.length) {
        message.textContent = "密码长度不足以包含所有已选字符类型。";
        return;
      }

      const chars = pools.map(pool => pool[secureIndex(pool.length)]);
      const allChars = pools.join("");
      while (chars.length < length) chars.push(allChars[secureIndex(allChars.length)]);
      document.getElementById("password").value = shuffle(chars).join("");
      message.textContent = "已生成新密码";
    }

    async function copyPassword() {
      const input = document.getElementById("password");
      const message = document.getElementById("message");
      if (!input.value) generatePassword();
      if (!input.value) return;
      try {
        await navigator.clipboard.writeText(input.value);
        message.textContent = "密码已复制到剪贴板";
      } catch {
        input.focus();
        input.select();
        const copied = document.execCommand("copy");
        message.textContent = copied ? "密码已复制到剪贴板" : "复制失败，请手动选中并复制";
      }
    }

    document.getElementById("generateBtn").addEventListener("click", generatePassword);
    document.getElementById("copyBtn").addEventListener("click", copyPassword);
    generatePassword();
  </script>
</body>
</html>
