name: Update Jinan Weather

on:
  push:
    paths:
      - '.github/workflows/jinan-weather.yml'
      - 'scripts/jinan_weather.py'
      - 'scripts/openmeteo_weather.py'
      - 'tianqi.html'
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jinan-weather
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Crawl Open-Meteo weather (primary)
        id: openmeteo
        continue-on-error: true
        run: python scripts/openmeteo_weather.py

      - name: Crawl 2345 weather (fallback)
        id: fallback
        continue-on-error: true
        run: python scripts/jinan_weather.py

      - name: Verify at least one source succeeded
        if: steps.openmeteo.outcome != 'success' && steps.fallback.outcome != 'success'
        run: |
          echo "::error::Open-Meteo and 2345 both failed; keep previously published JSON files."
          exit 1

      - name: Commit updated weather JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A previous scheduled run may have pushed while this run was fetching.
          # Rebase conflicts on generated JSON are avoided by refreshing the base
          # while keeping this run's newly generated files in the working tree.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add data/openmeteo_weather.json data/jinan_weather.json
            if git diff --cached --quiet; then
              echo "Weather data unchanged; skip commit."
              exit 0
            fi
            git commit -m "Update Jinan weather data"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying against latest main."
          done
          echo "::error::Could not push weather data after 3 attempts."
          exit 1
