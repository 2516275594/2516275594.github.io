<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本管理器</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <!-- Supabase JS SDK - 双CDN回退，去掉易出错的SRI校验 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { height: 100vh; display: flex; background: #f0f2f5; overflow: hidden; }
        /* 侧边栏 */
        .sidebar { width: 280px; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; transition: width 0.3s ease; position: relative; z-index: 10; }
        .sidebar.collapsed { width: 0; overflow: hidden; border-right: none; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { font-size: 18px; color: #1f2937; }
        .new-file-btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .new-file-btn:hover { background: #2563eb; }
        .file-list { flex: 1; overflow-y: auto; padding: 8px; }
        .file-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .file-item:hover { background: #f3f4f6; }
        .file-item.active { background: #eff6ff; border-left: 3px solid #3b82f6; }
        .file-item-name { font-size: 14px; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-item-actions { display: none; gap: 8px; }
        .file-item:hover .file-item-actions { display: flex; }
        .file-item-actions button { background: none; border: none; cursor: pointer; color: #6b7280; padding: 2px 4px; border-radius: 4px; }
        .file-item-actions button:hover { color: #ef4444; background: #fee2e2; }
        /* 折叠按钮 - 移到左侧 */
        .toggle-sidebar { position: absolute; left: 280px; top: 50%; transform: translateY(-50%); width: 24px; height: 60px; background: #fff; border: 1px solid #e5e7eb; border-left: none; border-radius: 0 8px 8px 0; cursor: pointer; z-index: 100; display: flex; align-items: center; justify-content: center; color: #6b7280; transition: left 0.3s ease; box-shadow: 2px 0 4px rgba(0,0,0,0.05); }
        .toggle-sidebar:hover { background: #f9fafb; color: #3b82f6; }
        .sidebar.collapsed + .toggle-sidebar { left: 0; }
        .toggle-sidebar i { transition: transform 0.3s ease; }
        .sidebar.collapsed + .toggle-sidebar i { transform: rotate(180deg); }
        /* 主编辑区 */
        .main { flex: 1; display: flex; flex-direction: column; position: relative; }
        .toolbar { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .toolbar-left { display: flex; align-items: center; gap: 12px; margin-left: 30px; transition: margin-left 0.3s ease; }
        .sidebar.collapsed ~ .main .toolbar-left { margin-left: 0; }
        .filename { font-size: 16px; font-weight: 500; color: #1f2937; border: none; outline: none; background: transparent; padding: 4px 8px; border-radius: 4px; width: 200px; }
        .filename:focus { background: #f3f4f6; }
        .mode-badge { padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .mode-badge.read { background: #e5e7eb; color: #4b5563; }
        .mode-badge.edit { background: #fef3c7; color: #d97706; }
        .toolbar-right { display: flex; gap: 8px; align-items: center; }
        .toolbar-btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .save-btn { background: #10b981; color: white; }
        .save-btn:hover:not(:disabled) { background: #059669; }
        .save-btn:disabled { background: #9ca3af; cursor: not-allowed; opacity: 0.6; }
        .edit-btn { background: #3b82f6; color: white; }
        .edit-btn.editing { background: #f59e0b; }
        .edit-btn:hover { opacity: 0.9; }
        .bookmark-toggle { background: #8b5cf6; color: white; position: relative; }
        .bookmark-toggle:hover { background: #7c3aed; }
        .bookmark-badge { position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        /* 编辑器容器 */
        .editor-container { flex: 1; padding: 20px 30px; position: relative; overflow: hidden; transition: padding 0.3s ease; margin-left: 30px; }
        .sidebar.collapsed ~ .main .editor-container { margin-left: 0; padding: 20px 40px; }
        .editor-wrapper { width: 800px; height: 100%; margin: 0 auto; position: relative; transform-origin: top left; transition: transform 0s linear; }
        #editor { width: 100%; height: 100%; border: none; outline: none; resize: none; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); font-size: 16px; line-height: 1.8; font-family: "SF Mono", Consolas, Monaco, monospace; transition: all 0.2s; }
        #editor.readonly { background: #f9fafb; cursor: default; }
        #editor.editing { background: #fff; border: 2px solid #fbbf24; box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.1); }
        .readonly-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #9ca3af; font-size: 14px; pointer-events: none; display: none; }
        #editor.readonly + .readonly-hint { display: block; }
        /* 书签面板 - 悬浮模式，不挤压正文 */
        .bookmark-panel { position: absolute; right: -320px; top: 0; width: 300px; height: calc(100% - 57px); background: #fff; box-shadow: -4px 0 16px rgba(0,0,0,0.1); z-index: 50; transition: right 0.3s ease; display: flex; flex-direction: column; }
        .bookmark-panel.open { right: 0; }
        .bookmark-header { padding: 16px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .bookmark-header h3 { font-size: 16px; color: #1f2937; }
        .add-bookmark-btn { background: #8b5cf6; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 4px; }
        .add-bookmark-btn:hover { background: #7c3aed; }
        .bookmark-list { flex: 1; overflow-y: auto; padding: 8px; }
        .bookmark-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px; background: #f9fafb; transition: all 0.2s; position: relative; }
        .bookmark-item:hover { background: #f3e8ff; }
        .bookmark-item-name { font-size: 13px; color: #374151; font-weight: 500; margin-bottom: 2px; }
        .bookmark-item-preview { font-size: 11px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bookmark-item-actions { position: absolute; top: 8px; right: 8px; display: none; gap: 4px; }
        .bookmark-item:hover .bookmark-item-actions { display: flex; }
        .bookmark-item-actions button { background: none; border: none; cursor: pointer; color: #9ca3af; padding: 2px; border-radius: 4px; }
        .bookmark-item-actions button:hover { color: #ef4444; }
        .empty-bookmarks { text-align: center; padding: 40px 20px; color: #9ca3af; font-size: 13px; }
        /* 状态栏 */
        .statusbar { padding: 8px 20px; background: #fff; border-top: 1px solid #e5e7eb; font-size: 12px; color: #6b7280; display: flex; justify-content: space-between; align-items: center; margin-left: 30px; transition: margin-left 0.3s ease; }
        .sidebar.collapsed ~ .main .statusbar { margin-left: 0; }
        .sync-status { display: flex; align-items: center; gap: 6px; }
        .sync-status.online { color: #10b981; }
        .sync-status.offline { color: #f59e0b; }
        /* 跳转提示 */
        .jump-toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 16px; border-radius: 8px; font-size: 13px; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .jump-toast.show { opacity: 1; }
        /* 通知 */
        .notification { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: white; font-size: 14px; z-index: 1000; transform: translateY(100px); opacity: 0; transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .notification.show { transform: translateY(0); opacity: 1; }
        .notification.success { background: #10b981; }
        .notification.error { background: #ef4444; }
        .notification.info { background: #3b82f6; }
        /* 移动端 */
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 20px; color: #374151; cursor: pointer; }
        @media (max-width: 768px) {
            .sidebar { position: absolute; left: 0; top: 0; height: 100vh; z-index: 200; transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.open { transform: translateX(0); }
            .toggle-sidebar { display: none; }
            .mobile-menu-btn { display: block; }
            .editor-wrapper { width: calc(100vw - 40px); }
            .bookmark-panel { width: 80vw; right: -80vw; }
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>我的笔记</h2>
            <button class="new-file-btn" onclick="createNewFile()">
                <i class="fas fa-plus"></i> 新建
            </button>
        </div>
        <div class="file-list" id="fileList"></div>
    </div>

    <!-- 折叠按钮 -->
    <button class="toggle-sidebar" onclick="toggleSidebar()">
        <i class="fas fa-chevron-left"></i>
    </button>

    <!-- 主区域 -->
    <div class="main">
        <div class="toolbar">
            <div class="toolbar-left">
                <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <input type="text" class="filename" id="filename" value="未命名笔记" readonly>
                <span class="mode-badge read" id="modeBadge">阅读模式</span>
            </div>
            <div class="toolbar-right">
                <button class="toolbar-btn bookmark-toggle" onclick="toggleBookmarkPanel()">
                    <i class="fas fa-bookmark"></i>
                    <span class="bookmark-badge" id="bookmarkBadge">0</span>
                </button>
                <button class="toolbar-btn edit-btn" id="editBtn" onclick="toggleEditMode()">
                    <i class="fas fa-pen"></i> 编辑
                </button>
                <button class="toolbar-btn save-btn" id="saveBtn" onclick="saveFile()" disabled>
                    <i class="fas fa-save"></i> 保存
                </button>
            </div>
        </div>

        <div class="editor-container" id="editorContainer">
            <div class="editor-wrapper" id="editorWrapper">
                <textarea id="editor" class="readonly" placeholder="在这里开始写作..." readonly></textarea>
                <div class="readonly-hint">阅读模式 — 点击「编辑」按钮开始修改</div>
            </div>
            <div class="jump-toast" id="jumpToast"></div>
            
            <!-- 书签面板 -->
            <div class="bookmark-panel" id="bookmarkPanel">
                <div class="bookmark-header">
                    <h3><i class="fas fa-bookmark"></i> 书签</h3>
                    <button class="add-bookmark-btn" onclick="addBookmarkAtCursor()">
                        <i class="fas fa-plus"></i> 当前位置
                    </button>
                </div>
                <div class="bookmark-list" id="bookmarkList">
                    <div class="empty-bookmarks">暂无书签<br>按 Ctrl+B 快速添加</div>
                </div>
            </div>
        </div>

        <div class="statusbar">
            <div id="positionInfo">行 1, 列 1</div>
            <div class="sync-status offline" id="syncStatus">
                <i class="fas fa-database"></i> <span id="syncText">本地模式</span>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // ==================== 全局状态 ====================
        const SUPABASE_URL = 'https://ubsdjmcnonsormczvtuq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVic2RqbWNub25zb3JtY3p2dHVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI4NjgwMDAsImV4cCI6MjA3ODQ0NDAwMH0.Cp03e89qS9k2X7z5R8t4Y6u3I1o0P7a2S9d4F6g8H0j2K5l8M3n7B1v9C4x6Z2a3s5D7f9G';
        
        let supabase = null;
        let isCloudAvailable = false;
        let currentFileId = null;
        let isEditMode = false;
        let files = [];
        let currentBookmarks = [];
        let sidebarCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
        
        // ==================== 初始化 ====================
        async function init() {
            // 1. 先检查Supabase是否加载成功
            if (window.supabase && window.supabase.createClient) {
                try {
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                        auth: { persistSession: false }
                    });
                    // 测试连接
                    const { error } = await supabase.from('text_files').select('id', { count: 'exact', head: true });
                    if (!error) {
                        isCloudAvailable = true;
                        updateSyncStatus(true, '云端同步已连接');
                    } else {
                        console.warn('云数据库连接失败，自动降级为本地模式:', error.message);
                    }
                } catch (e) {
                    console.warn('Supabase初始化失败，自动降级为本地模式:', e);
                }
            } else {
                console.warn('Supabase SDK加载失败，自动降级为本地模式');
            }
            
            if (!isCloudAvailable) {
                updateSyncStatus(false, '本地模式（云端不可用）');
                showNotification('云端连接失败，已自动切换为纯本地模式，书签保存在浏览器中', 'info');
            }

            // 2. 加载文件列表
            await loadFiles();
            
            // 3. 初始化UI
            initSidebar();
            initEditor();
            initShortcuts();
            initScaleOnResize();
            
            // 4. 恢复上次打开的文件
            const lastFileId = localStorage.getItem('lastFileId');
            if (lastFileId) {
                openFile(lastFileId);
            } else if (files.length > 0) {
                openFile(files[0].id);
            }
        }

        function updateSyncStatus(online, text) {
            const el = document.getElementById('syncStatus');
            const textEl = document.getElementById('syncText');
            if (online) {
                el.className = 'sync-status online';
                el.innerHTML = `<i class="fas fa-cloud"></i> <span>${text}</span>`;
            } else {
                el.className = 'sync-status offline';
                el.innerHTML = `<i class="fas fa-hdd"></i> <span>${text}</span>`;
            }
        }

        // ==================== 文件操作 ====================
        async function loadFiles() {
            try {
                let result;
                if (isCloudAvailable) {
                    result = await supabase.from('text_files').select('*').order('updated_at', { ascending: false });
                    if (result.error) throw result.error;
                    files = result.data || [];
                } else {
                    files = JSON.parse(localStorage.getItem('local_files') || '[]');
                }
                renderFileList();
            } catch (e) {
                console.error('加载文件列表失败:', e);
                files = JSON.parse(localStorage.getItem('local_files') || '[]');
                renderFileList();
            }
        }

        async function createNewFile() {
            const newFile = {
                id: crypto.randomUUID(),
                filename: '新建笔记',
                content: '',
                created_at: new Date().toISOString(),
                updated_at: new Date().toISOString()
            };
            
            try {
                if (isCloudAvailable) {
                    const { error } = await supabase.from('text_files').insert(newFile);
                    if (error) throw error;
                } else {
                    files.unshift(newFile);
                    localStorage.setItem('local_files', JSON.stringify(files));
                }
            } catch (e) {
                console.warn('云端创建失败，保存到本地:', e);
                files.unshift(newFile);
                localStorage.setItem('local_files', JSON.stringify(files));
            }
            
            await loadFiles();
            openFile(newFile.id);
            toggleEditMode(true);
            showNotification('新笔记已创建', 'success');
        }

        async function openFile(fileId) {
            // 先保存当前文件的位置和书签
            if (currentFileId) {
                saveCurrentPosition();
                await saveCurrentBookmarks();
            }
            
            let file;
            try {
                if (isCloudAvailable) {
                    const { data, error } = await supabase.from('text_files').select('*').eq('id', fileId).single();
                    if (error) throw error;
                    file = data;
                } else {
                    file = files.find(f => f.id === fileId);
                }
            } catch (e) {
                file = files.find(f => f.id === fileId);
            }
            
            if (!file) return;
            
            currentFileId = fileId;
            document.getElementById('filename').value = file.filename;
            document.getElementById('editor').value = file.content;
            
            // 加载书签
            await loadBookmarks(fileId);
            
            // 恢复阅读位置
            restorePosition();
            
            // 更新文件列表激活状态
            renderFileList();
            updateBookmarkBadge();
            exitEditMode();
            
            localStorage.setItem('lastFileId', fileId);
        }

        async function saveFile() {
            if (!currentFileId || !isEditMode) return;
            
            const content = document.getElementById('editor').value;
            const filename = document.getElementById('filename').value;
            
            try {
                if (isCloudAvailable) {
                    const { error } = await supabase.from('text_files')
                        .update({ content, filename, updated_at: new Date().toISOString() })
                        .eq('id', currentFileId);
                    if (error) throw error;
                } else {
                    const idx = files.findIndex(f => f.id === currentFileId);
                    if (idx >= 0) {
                        files[idx].content = content;
                        files[idx].filename = filename;
                        files[idx].updated_at = new Date().toISOString();
                        localStorage.setItem('local_files', JSON.stringify(files));
                    }
                }
                
                exitEditMode();
                showNotification('保存成功', 'success');
                await loadFiles();
            } catch (e) {
                console.error('保存失败:', e);
                // 本地兜底保存
                const idx = files.findIndex(f => f.id === currentFileId);
                if (idx >= 0) {
                    files[idx].content = content;
                    files[idx].filename = filename;
                    localStorage.setItem('local_files', JSON.stringify(files));
                    showNotification('云端保存失败，已保存到本地', 'info');
                    exitEditMode();
                } else {
                    showNotification('保存失败: ' + e.message, 'error');
                }
            }
        }

        async function deleteFile(fileId, event) {
            event.stopPropagation();
            if (!confirm('确定要删除这个笔记吗？此操作不可恢复。')) return;
            
            try {
                if (isCloudAvailable) {
                    await supabase.from('text_files').delete().eq('id', fileId);
                }
                files = files.filter(f => f.id !== fileId);
                if (!isCloudAvailable) {
                    localStorage.setItem('local_files', JSON.stringify(files));
                }
                
                if (currentFileId === fileId) {
                    currentFileId = null;
                    document.getElementById('editor').value = '';
                    document.getElementById('filename').value = '未命名笔记';
                    currentBookmarks = [];
                    renderBookmarks();
                    if (files.length > 0) {
                        openFile(files[0].id);
                    }
                }
                
                await loadFiles();
                showNotification('笔记已删除', 'success');
            } catch (e) {
                showNotification('删除失败: ' + e.message, 'error');
            }
        }

        function renderFileList() {
            const list = document.getElementById('fileList');
            const escapeHtml = (str) => {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            };
            
            list.innerHTML = files.map(file => `
                <div class="file-item ${file.id === currentFileId ? 'active' : ''}" onclick="openFile('${file.id}')">
                    <span class="file-item-name">${escapeHtml(file.filename)}</span>
                    <div class="file-item-actions">
                        <button onclick="deleteFile('${file.id}', event)" title="删除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ==================== 编辑模式切换 ====================
        function toggleEditMode(forceEdit = null) {
            const editor = document.getElementById('editor');
            const editBtn = document.getElementById('editBtn');
            const saveBtn = document.getElementById('saveBtn');
            const filenameInput = document.getElementById('filename');
            const modeBadge = document.getElementById('modeBadge');
            
            if (forceEdit !== null) {
                isEditMode = forceEdit;
            } else {
                isEditMode = !isEditMode;
            }
            
            if (isEditMode) {
                editor.removeAttribute('readonly');
                editor.className = 'editing';
                editBtn.innerHTML = '<i class="fas fa-check"></i> 完成';
                editBtn.classList.add('editing');
                saveBtn.disabled = false;
                filenameInput.removeAttribute('readonly');
                modeBadge.textContent = '编辑模式';
                modeBadge.className = 'mode-badge edit';
                editor.focus();
            } else {
                editor.setAttribute('readonly', 'readonly');
                editor.className = 'readonly';
                editBtn.innerHTML = '<i class="fas fa-pen"></i> 编辑';
                editBtn.classList.remove('editing');
                saveBtn.disabled = true;
                filenameInput.setAttribute('readonly', 'readonly');
                modeBadge.textContent = '阅读模式';
                modeBadge.className = 'mode-badge read';
            }
        }
        
        function exitEditMode() {
            toggleEditMode(false);
        }

        // ==================== 侧边栏控制 ====================
        function initSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebarCollapsed) {
                sidebar.classList.add('collapsed');
            }
            // 初始缩放
            setTimeout(updateEditorScale, 50);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            sidebarCollapsed = sidebar.classList.contains('collapsed');
            localStorage.setItem('sidebarCollapsed', sidebarCollapsed);
            // 缩放会在resize observer中自动更新
        }

        function toggleMobileSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // ==================== 编辑器缩放（不改变排版） ====================
        function updateEditorScale() {
            const wrapper = document.getElementById('editorWrapper');
            const container = document.getElementById('editorContainer');
            const editor = document.getElementById('editor');
            
            const containerWidth = container.clientWidth - 60;
            const baseWidth = window.innerWidth < 768 ? containerWidth : 800;
            
            // 移动窗口时适配
            if (window.innerWidth < 768) {
                wrapper.style.width = '100%';
                wrapper.style.transform = 'none';
                return;
            }
            
            const scale = Math.min(containerWidth / baseWidth, 2.5);
            
            wrapper.style.width = baseWidth + 'px';
            wrapper.style.transform = `scale(${scale})`;
            wrapper.style.height = `calc(100% / ${scale})`;
            wrapper.style.transformOrigin = 'top left';
            wrapper.style.margin = 0;
            
            // 调整容器padding适配缩放
            const offsetX = (containerWidth - baseWidth * scale) / 2;
            wrapper.style.marginLeft = Math.max(0, offsetX) + 'px';
        }
        
        function initScaleOnResize() {
            // 用ResizeObserver实时跟踪容器宽度变化，逐帧更新缩放
            const container = document.getElementById('editorContainer');
            if (window.ResizeObserver) {
                const ro = new ResizeObserver(() => {
                    requestAnimationFrame(updateEditorScale);
                });
                ro.observe(container);
            }
            window.addEventListener('resize', updateEditorScale);
        }

        // ==================== 编辑器功能 ====================
        function initEditor() {
            const editor = document.getElementById('editor');
            
            editor.addEventListener('click', () => {
                if (!isEditMode && editor.selectionStart === 0) {
                    // 仅提示一次，不频繁打扰
                }
            });
            
            // 更新光标位置显示
            editor.addEventListener('keyup click', updatePositionInfo);
            editor.addEventListener('scroll', () => {
                if (currentFileId) {
                    saveCurrentPosition();
                }
            });
            
            // ESC退出编辑模式
            editor.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isEditMode) {
                    exitEditMode();
                    showNotification('已退出编辑模式，记得保存修改', 'info');
                }
            });
            
            // 只读状态点击提示
            editor.addEventListener('mousedown', (e) => {
                if (!isEditMode) {
                    // 允许选中文本，不打断
                }
            });
        }

        function updatePositionInfo() {
            const editor = document.getElementById('editor');
            const text = editor.value.substring(0, editor.selectionStart);
            const lines = text.split('\n');
            const line = lines.length;
            const col = lines[lines.length - 1].length + 1;
            document.getElementById('positionInfo').textContent = `行 ${line}, 列 ${col}`;
        }

        // ==================== 阅读位置记忆 ====================
        function saveCurrentPosition() {
            if (!currentFileId) return;
            const editor = document.getElementById('editor');
            const pos = {
                scrollTop: editor.scrollTop,
                cursorPos: editor.selectionStart,
                scrollRatio: editor.scrollHeight > 0 ? editor.scrollTop / editor.scrollHeight : 0
            };
            localStorage.setItem(`pos_${currentFileId}`, JSON.stringify(pos));
        }

        function restorePosition() {
            if (!currentFileId) return;
            const saved = localStorage.getItem(`pos_${currentFileId}`);
            if (!saved) return;
            
            try {
                const pos = JSON.parse(saved);
                const editor = document.getElementById('editor');
                setTimeout(() => {
                    // 优先按比例恢复，兼容缩放后的变化
                    if (pos.scrollRatio) {
                        editor.scrollTop = pos.scrollRatio * editor.scrollHeight;
                    } else if (pos.scrollTop) {
                        editor.scrollTop = pos.scrollTop;
                    }
                }, 100);
            } catch (e) {}
        }

        // ==================== 书签功能 ====================
        function toggleBookmarkPanel() {
            const panel = document.getElementById('bookmarkPanel');
            panel.classList.toggle('open');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function loadBookmarks(fileId) {
            currentBookmarks = [];
            try {
                if (isCloudAvailable) {
                    // 尝试从云端加载
                    const { data, error } = await supabase.from('text_bookmarks')
                        .select('bookmarks_json')
                        .eq('file_id', fileId)
                        .maybeSingle();
                    if (data && data.bookmarks_json) {
                        currentBookmarks = data.bookmarks_json;
                    }
                }
            } catch (e) {
                console.warn('云端书加载失败，从本地加载:', e);
            }
            
            // 云端没有则从本地读取（兼容旧数据）
            if (currentBookmarks.length === 0) {
                const local = localStorage.getItem(`bookmarks_${fileId}`);
                if (local) {
                    try {
                        currentBookmarks = JSON.parse(local);
                        // 自动迁移到云端
                        if (isCloudAvailable) {
                            await saveCurrentBookmarks(true);
                        }
                    } catch (e) {}
                }
            }
            
            renderBookmarks();
            updateBookmarkBadge();
        }

        async function saveCurrentBookmarks(silent = false) {
            if (!currentFileId) return;
            
            // 始终保存到本地（离线缓存）
            localStorage.setItem(`bookmarks_${currentFileId}`, JSON.stringify(currentBookmarks));
            
            // 云端可用时同步
            if (!isCloudAvailable) return;
            
            try {
                // upsert：有则更新，无则插入
                const { error } = await supabase.from('text_bookmarks')
                    .upsert({
                        file_id: currentFileId,
                        bookmarks_json: currentBookmarks,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'file_id' });
                
                if (error && !silent) {
                    console.warn('书签云端同步失败，已保存在本地:', error.message);
                }
            } catch (e) {
                console.warn('书签云端同步异常，已保存在本地:', e);
            }
        }

        // 防抖保存
        let bookmarkSaveTimer = null;
        function scheduleBookmarkSave() {
            clearTimeout(bookmarkSaveTimer);
            bookmarkSaveTimer = setTimeout(() => saveCurrentBookmarks(), 300);
        }

        function addBookmarkAtCursor() {
            const editor = document.getElementById('editor');
            let pos, linePreview;
            
            if (isEditMode) {
                pos = editor.selectionStart;
                const text = editor.value;
                const lineStart = text.lastIndexOf('\n', pos - 1) + 1;
                const lineEnd = text.indexOf('\n', pos);
                linePreview = text.substring(lineStart, lineEnd > -1 ? lineEnd : text.length).trim().substring(0, 20) || '无标题行';
            } else {
                // 阅读模式：取当前屏幕顶部对应的位置
                const lineHeight = parseInt(getComputedStyle(editor).lineHeight);
                const lineIndex = Math.round(editor.scrollTop / lineHeight);
                const text = editor.value;
                let charPos = 0;
                let lines = 0;
                for (let i = 0; i < text.length; i++) {
                    if (text[i] === '\n') lines++;
                    if (lines >= lineIndex) {
                        charPos = i;
                        break;
                    }
                }
                pos = charPos;
                const lineStart = text.lastIndexOf('\n', pos - 1) + 1;
                const lineEnd = text.indexOf('\n', pos);
                linePreview = text.substring(lineStart, lineEnd > -1 ? lineEnd : text.length).trim().substring(0, 20) || '无标题行';
            }
            
            const defaultName = prompt('书签名称:', linePreview);
            if (defaultName === null) return;
            
            const bookmark = {
                id: Date.now().toString(),
                name: defaultName.trim() || linePreview,
                position: pos,
                preview: linePreview,
                createdAt: new Date().toISOString()
            };
            
            currentBookmarks.push(bookmark);
            currentBookmarks.sort((a, b) => a.position - b.position);
            
            renderBookmarks();
            updateBookmarkBadge();
            scheduleBookmarkSave();
            showNotification('书签已添加', 'success');
        }

        function jumpToBookmark(bookmarkId) {
            const bookmark = currentBookmarks.find(b => b.id === bookmarkId);
            if (!bookmark) return;
            
            const editor = document.getElementById('editor');
            editor.focus();
            
            // 使用真实排版测量精确定位
            const lineHeight = parseInt(getComputedStyle(editor).lineHeight);
            const paddingTop = parseInt(getComputedStyle(editor).paddingTop);
            
            // 创建镜像元素测量真实折行后的位置
            const mirror = document.createElement('div');
            mirror.style.cssText = `
                position: absolute;
                visibility: hidden;
                width: ${editor.clientWidth - parseInt(getComputedStyle(editor).paddingLeft) - parseInt(getComputedStyle(editor).paddingRight)}px;
                font-size: ${getComputedStyle(editor).fontSize};
                font-family: ${getComputedStyle(editor).fontFamily};
                line-height: ${getComputedStyle(editor).lineHeight};
                white-space: pre-wrap;
                word-wrap: break-word;
                top: 0;
                left: -9999px;
            `;
            mirror.textContent = editor.value.substring(0, bookmark.position);
            document.body.appendChild(mirror);
            const targetScrollTop = mirror.offsetHeight - paddingTop + 10;
            document.body.removeChild(mirror);
            
            editor.scrollTop = targetScrollTop;
            editor.setSelectionRange(bookmark.position, bookmark.position);
            updatePositionInfo();
            
            // 显示跳转提示
            const toast = document.getElementById('jumpToast');
            toast.textContent = `已定位: ${bookmark.name}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }

        function deleteBookmark(bookmarkId, event) {
            event.stopPropagation();
            currentBookmarks = currentBookmarks.filter(b => b.id !== bookmarkId);
            renderBookmarks();
            updateBookmarkBadge();
            scheduleBookmarkSave();
            showNotification('书签已删除', 'info');
        }

        function renameBookmark(bookmarkId, event) {
            event.stopPropagation();
            const bookmark = currentBookmarks.find(b => b.id === bookmarkId);
            if (!bookmark) return;
            
            const newName = prompt('新名称:', bookmark.name);
            if (newName === null) return;
            
            bookmark.name = newName.trim() || bookmark.name;
            renderBookmarks();
            scheduleBookmarkSave();
        }

        function renderBookmarks() {
            const list = document.getElementById('bookmarkList');
            
            if (currentBookmarks.length === 0) {
                list.innerHTML = '<div class="empty-bookmarks">暂无书签<br>按 Ctrl+B 快速添加</div>';
                return;
            }
            
            list.innerHTML = currentBookmarks.map(b => `
                <div class="bookmark-item" onclick="jumpToBookmark('${b.id}')">
                    <div class="bookmark-item-name">${escapeHtml(b.name)}</div>
                    <div class="bookmark-item-preview">${escapeHtml(b.preview)}</div>
                    <div class="bookmark-item-actions">
                        <button onclick="renameBookmark('${b.id}', event)" title="重命名">
                            <i class="fas fa-pen"></i>
                        </button>
                        <button onclick="deleteBookmark('${b.id}', event)" title="删除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateBookmarkBadge() {
            document.getElementById('bookmarkBadge').textContent = currentBookmarks.length;
        }

        // ==================== 快捷键 ====================
        function initShortcuts() {
            document.addEventListener('keydown', (e) => {
                // Ctrl+S 保存
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    if (isEditMode && currentFileId) {
                        saveFile();
                    } else {
                        showNotification('请先进入编辑模式再保存', 'info');
                    }
                }
                // Ctrl+B 添加书签
                if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
                    e.preventDefault();
                    if (currentFileId) {
                        addBookmarkAtCursor();
                    }
                }
            });
        }

        // ==================== 通知 ====================
        function showNotification(message, type = 'info') {
            const el = document.getElementById('notification');
            const icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle' };
            el.className = `notification ${type}`;
            el.innerHTML = `<i class="fas ${icons[type]}"></i> <span></span>`;
            el.querySelector('span').textContent = message;
            el.classList.add('show');
            
            setTimeout(() => el.classList.remove('show'), 2500);
        }

        // ==================== 启动 ====================
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
