    <!-- 主应用逻辑 -->
    <script>
        (function() {
            let supabase;
            let currentFileId = null;
            let files = [];
            let editingFileId = null;
            let bookmarks = {}; // { fileId: [{ id, name, position, scrollTop, preview, createdAt }] }
            let pendingBookmarkPosition = null;
            let isRestoringPosition = false;
            let isEditMode = false; // 当前是否为编辑模式
            let measureMirrorEl = null;   // 用于测量文本真实排版（含自动换行）的隐藏镜像元素
            let measureTextEl = null;
            let measureMarkerEl = null;
            let bookmarkFlashEl = null;   // 书签跳转提示条
            
            // DOM元素
            const connectionStatusEl = document.getElementById('connection-status');
            const statusDotEl = document.querySelector('.status-dot');
            const fileListEl = document.getElementById('file-list');
            const currentFilenameEl = document.getElementById('current-filename');
            const contentEl = document.getElementById('content');
            const charCountEl = document.getElementById('char-count');
            const cursorInfoEl = document.getElementById('cursor-info');
            const saveBtnEl = document.getElementById('save-btn');
            const editModeBtnEl = document.getElementById('edit-mode-btn');
            const textEditorEl = document.getElementById('text-editor');
            const readModeTipEl = document.getElementById('read-mode-tip');
            const addFileBtnEl = document.getElementById('add-file-btn');
            const notificationEl = document.getElementById('notification');
            const searchInputEl = document.getElementById('search-input');
            const sidebarEl = document.getElementById('sidebar');
            const toggleSidebarEl = document.getElementById('toggle-sidebar');
            const mobileMenuBtnEl = document.getElementById('mobile-menu-btn');
            
            // 书签相关元素
            const bookmarkPanelEl = document.getElementById('bookmark-panel');
            const bookmarkToggleEl = document.getElementById('bookmark-toggle');
            const bookmarkCountEl = document.getElementById('bookmark-count');
            const addBookmarkBtnEl = document.getElementById('add-bookmark-btn');
            const bookmarkListEl = document.getElementById('bookmark-list');
            const closeBookmarkEl = document.getElementById('close-bookmark');
            const bookmarkModalEl = document.getElementById('bookmark-modal');
            const bookmarkNameInputEl = document.getElementById('bookmark-name-input');
            const bookmarkConfirmEl = document.getElementById('bookmark-confirm');
            const bookmarkCancelEl = document.getElementById('bookmark-cancel');
            
            document.addEventListener('DOMContentLoaded', initApp);
            
            async function initApp() {
                if (!SUPABASE_URL || !SUPABASE_ANON_KEY || 
                    SUPABASE_URL === 'https://your-project.supabase.co' || 
                    SUPABASE_ANON_KEY === 'your-anon-key') {
                    showNotification('请先配置Supabase连接信息', 'error');
                    connectionStatusEl.textContent = '配置错误';
                    statusDotEl.style.backgroundColor = 'var(--error)';
                    return;
                }
                
                try {
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { data, error } = await supabase.from('text_files').select('id').limit(1);
                    if (error) throw error;
                    
                    connectionStatusEl.textContent = '已连接到数据库';
                    statusDotEl.style.backgroundColor = 'var(--success)';
                    
                    await loadFiles();
                    setupEventListeners();
                    setupBookmarkEventListeners();
                    
                    contentEl.addEventListener('input', () => {
                        if (!isEditMode) return;
                        updateCharCount();
                        updateCursorInfo();
                        saveCurrentPosition();
                    });
                    contentEl.addEventListener('keyup', () => {
                        updateCursorInfo();
                        saveCurrentPosition();
                    });
                    contentEl.addEventListener('click', () => {
                        updateCursorInfo();
                        saveCurrentPosition();
                    });
                    contentEl.addEventListener('scroll', () => {
                        if (!isRestoringPosition) {
                            saveCurrentPosition();
                        }
                    });
                    // 阅读模式下尝试点击编辑按钮的提示
                    contentEl.addEventListener('click', (e) => {
                        if (!isEditMode && currentFileId) {
                            showNotification('当前为阅读模式，请点击右上角「编辑」按钮修改', 'warning');
                        }
                    });
                    // 初始化为阅读模式
                    setReadMode();
                } catch (error) {
                    console.error('数据库连接失败:', error);
                    connectionStatusEl.textContent = '数据库连接失败';
                    statusDotEl.style.backgroundColor = 'var(--error)';
                    showNotification('数据库连接失败: ' + error.message, 'error');
                }
            }
            // ========== 阅读/编辑模式切换 ==========
            
            function setReadMode() {
                isEditMode = false;
                contentEl.readOnly = true;
                textEditorEl.classList.remove('edit-mode');
                textEditorEl.classList.add('read-mode');
                editModeBtnEl.classList.remove('editing');
                editModeBtnEl.innerHTML = '<i class="fas fa-pen"></i> <span>编辑</span>';
                editModeBtnEl.title = '点击进入编辑模式';
                saveBtnEl.disabled = true;
                
                updateModeIndicator('read');
                
                if (currentFileId && (!contentEl.value || contentEl.value.trim() === '')) {
                    readModeTipEl.classList.add('show');
                } else {
                    readModeTipEl.classList.remove('show');
                }
            }
            
            function setEditMode() {
                if (!currentFileId) {
                    showNotification('请先选择或创建一个文件', 'warning');
                    return;
                }
                isEditMode = true;
                contentEl.readOnly = false;
                textEditorEl.classList.remove('read-mode');
                textEditorEl.classList.add('edit-mode');
                editModeBtnEl.classList.add('editing');
                editModeBtnEl.innerHTML = '<i class="fas fa-check"></i> <span>完成</span>';
                editModeBtnEl.title = '点击退出编辑模式';
                saveBtnEl.disabled = false;
                readModeTipEl.classList.remove('show');
                
                updateModeIndicator('edit');
                
                contentEl.focus();
                const end = contentEl.value.length;
                contentEl.setSelectionRange(end, end);
                updateCursorInfo();
            }
            function updateModeIndicator(mode) {
                const oldIndicator = currentFilenameEl.querySelector('.mode-indicator');
                if (oldIndicator) oldIndicator.remove();
                
                const indicator = document.createElement('span');
                indicator.className = `mode-indicator ${mode}-mode`;
                indicator.textContent = mode === 'read' ? '阅读模式' : '编辑模式';
                currentFilenameEl.appendChild(indicator);
            }
            
            function toggleEditMode() {
                if (isEditMode) {
                    setReadMode();
                    showNotification('已退出编辑模式，未保存的修改不会丢失，请点击保存', 'info');
                } else {
                    setEditMode();
                    showNotification('已进入编辑模式，可以开始修改', 'success');
                }
            }
            
            // ========== 文本排版测量 ==========
            function ensureMeasureMirror() {
                if (!measureMirrorEl || !document.body.contains(measureMirrorEl)) {
                    measureMirrorEl = document.createElement('div');
                    measureMirrorEl.setAttribute('aria-hidden', 'true');
                    measureTextEl = document.createElement('span');
                    measureMarkerEl = document.createElement('span');
                    measureMarkerEl.textContent = '\u200b';
                    measureMirrorEl.appendChild(measureTextEl);
                    measureMirrorEl.appendChild(measureMarkerEl);
                    const s = measureMirrorEl.style;
                    s.position = 'absolute';
                    s.top = '0';
                    s.left = '-99999px';
                    s.visibility = 'hidden';
                    s.pointerEvents = 'none';
                    s.zIndex = '-1';
                    s.margin = '0';
                    s.border = '0';
                    s.boxSizing = 'border-box';
                    s.height = 'auto';
                    s.overflow = 'hidden';
                    document.body.appendChild(measureMirrorEl);
                }
                syncMeasureMirrorStyle();
                return measureMirrorEl;
            }
            function syncMeasureMirrorStyle() {
                const cs = window.getComputedStyle(contentEl);
                const s = measureMirrorEl.style;
                s.width = contentEl.clientWidth + 'px';
                s.paddingTop = cs.paddingTop;
                s.paddingRight = cs.paddingRight;
                s.paddingBottom = cs.paddingBottom;
                s.paddingLeft = cs.paddingLeft;
                s.fontFamily = cs.fontFamily;
                s.fontSize = cs.fontSize;
                s.fontWeight = cs.fontWeight;
                s.fontStyle = cs.fontStyle;
                s.lineHeight = cs.lineHeight;
                s.letterSpacing = cs.letterSpacing;
                s.wordSpacing = cs.wordSpacing;
                s.textIndent = cs.textIndent;
                s.textTransform = cs.textTransform;
                s.textAlign = cs.textAlign;
                s.direction = cs.direction;
                s.tabSize = cs.tabSize;
                s.whiteSpace = 'pre-wrap';
                s.overflowWrap = 'break-word';
                s.wordBreak = 'break-word';
            }
            function measureCharTop(pos) {
                const value = contentEl.value;
                const p = Math.max(0, Math.min(pos, value.length));
                ensureMeasureMirror();
                measureTextEl.textContent = value.substring(0, p);
                const mirrorRect = measureMirrorEl.getBoundingClientRect();
                const markerRect = measureMarkerEl.getBoundingClientRect();
                return markerRect.top - mirrorRect.top;
            }
            function findCharAtPixel(pixelY) {
                const value = contentEl.value;
                if (!value) return 0;
                let lo = 0, hi = value.length, best = 0;
                while (lo <= hi) {
                    const mid = (lo + hi) >> 1;
                    if (measureCharTop(mid) <= pixelY) {
                        best = mid;
                        lo = mid + 1;
                    } else {
                        hi = mid - 1;
                    }
                }
                return best;
            }
            function getMaxScroll() {
                return Math.max(0, contentEl.scrollHeight - contentEl.clientHeight);
            }
            function scrollToCharPos(pos, gap) {
                if (typeof gap !== 'number') gap = 24;
                const charTop = measureCharTop(pos);
                const target = Math.max(0, Math.min(charTop - gap, getMaxScroll()));
                isRestoringPosition = true;
                contentEl.scrollTo({ top: target, behavior: 'smooth' });
                setTimeout(() => { isRestoringPosition = false; }, 400);
                return target;
            }
            function showBookmarkFlash(name) {
                if (!bookmarkFlashEl) {
                    bookmarkFlashEl = document.createElement('div');
                    bookmarkFlashEl.className = 'bookmark-flash';
                    const host = document.getElementById('text-editor');
                    if (host) host.appendChild(bookmarkFlashEl);
                }
                bookmarkFlashEl.innerHTML = '<i class="fas fa-bookmark"></i> 已定位：' + escapeHtml(name || '书签');
                bookmarkFlashEl.classList.add('show');
                clearTimeout(bookmarkFlashEl._timer);
                bookmarkFlashEl._timer = setTimeout(() => {
                    bookmarkFlashEl.classList.remove('show');
                }, 1800);
            }
            // ========== 位置记忆功能 ==========
            
            function saveCurrentPosition() {
                if (!currentFileId) return;
                try {
                    const key = `textPosition_${currentFileId}`;
                    const maxScroll = getMaxScroll();
                    const data = {
                        scrollTop: contentEl.scrollTop,
                        maxScroll: maxScroll,
                        ratio: maxScroll > 0 ? contentEl.scrollTop / maxScroll : 0,
                        selectionStart: contentEl.selectionStart,
                        selectionEnd: contentEl.selectionEnd,
                        timestamp: Date.now()
                    };
                    localStorage.setItem(key, JSON.stringify(data));
                } catch(e) { /* ignore */ }
            }
            
            function restorePosition(fileId) {
                try {
                    const key = `textPosition_${fileId}`;
                    const saved = localStorage.getItem(key);
                    if (!saved) {
                        contentEl.scrollTop = 0;
                        return;
                    }
                    const data = JSON.parse(saved);
                    
                    requestAnimationFrame(() => {
                        isRestoringPosition = true;
                        const maxScrollNow = getMaxScroll();
                        let target = data.scrollTop || 0;
                        if (typeof data.maxScroll === 'number' && Math.abs(maxScrollNow - data.maxScroll) > 2) {
                            target = (data.ratio || 0) * maxScrollNow;
                        }
                        contentEl.scrollTop = Math.max(0, Math.min(target, maxScrollNow));
                        if (isEditMode && typeof data.selectionStart === 'number') {
                            try {
                                contentEl.setSelectionRange(
                                    Math.min(data.selectionStart, contentEl.value.length),
                                    Math.min(data.selectionEnd || data.selectionStart, contentEl.value.length)
                                );
                            } catch(e) {}
                        }
                        updateCursorInfo();
                        setTimeout(() => { isRestoringPosition = false; }, 100);
                    });
                } catch(e) {
                    isRestoringPosition = false;
                }
            }
            
            function updateCursorInfo() {
                if (!contentEl) return;
                const pos = contentEl.selectionStart;
                const text = contentEl.value.substring(0, pos);
                const line = (text.match(/\n/g) || []).length + 1;
                const lastNewline = text.lastIndexOf('\n');
                const col = pos - lastNewline;
                cursorInfoEl.textContent = `行 ${line}, 列 ${col}`;
            }
            
            // ========== 书签功能 - 数据库版 ==========
            
            // 从数据库加载指定文件的书签
            async function loadBookmarksFromDB(fileId) {
                if (!fileId) return [];
                
                // 未保存的新文件，从localStorage读取临时书签
                if (fileId.startsWith('new-')) {
                    try {
                        const saved = localStorage.getItem(`textBookmarks_${fileId}`);
                        return saved ? JSON.parse(saved) : [];
                    } catch(e) { return []; }
                }
                
                try {
                    const { data, error } = await supabase
                        .from('text_bookmarks')
                        .select('bookmarks_json')
                        .eq('file_id', fileId)
                        .maybeSingle();
                    
                    if (error) throw error;
                    return data?.bookmarks_json || [];
                } catch (error) {
                    console.error('加载书签失败:', error);
                    showNotification('书签加载失败: ' + error.message, 'error');
                    return [];
                }
            }
            
            // 保存书签到数据库
            async function saveBookmarksToDB(fileId) {
                if (!fileId) return;
                const bookmarkList = bookmarks[fileId] || [];
                
                // 未保存的新文件，临时存localStorage
                if (fileId.startsWith('new-')) {
                    try {
                        localStorage.setItem(`textBookmarks_${fileId}`, JSON.stringify(bookmarkList));
                    } catch(e) {}
                    return;
                }
                
                try {
                    // 先查询是否已有记录
                    const { data: existing } = await supabase
                        .from('text_bookmarks')
                        .select('file_id')
                        .eq('file_id', fileId)
                        .maybeSingle();
                    
                    if (existing) {
                        // 更新记录
                        const { error } = await supabase
                            .from('text_bookmarks')
                            .update({ 
                                bookmarks_json: bookmarkList,
                                updated_at: new Date().toISOString()
                            })
                            .eq('file_id', fileId);
                        if (error) throw error;
                    } else {
                        // 新增记录
                        const { error } = await supabase
                            .from('text_bookmarks')
                            .insert([{
                                file_id: fileId,
                                bookmarks_json: bookmarkList
                            }]);
                        if (error) throw error;
                    }
                } catch (error) {
                    console.error('保存书签失败:', error);
                    showNotification('书签保存失败: ' + error.message, 'error');
                }
            }
            
            function getCurrentFileBookmarks() {
                if (!currentFileId) return [];
                return bookmarks[currentFileId] || [];
            }
            
            function updateBookmarkBadge() {
                const list = getCurrentFileBookmarks();
                if (list.length > 0) {
                    bookmarkCountEl.textContent = list.length;
                    bookmarkCountEl.style.display = 'flex';
                } else {
                    bookmarkCountEl.style.display = 'none';
                }
            }
            
            function renderBookmarkList() {
                const list = getCurrentFileBookmarks();
                updateBookmarkBadge();
                
                if (!currentFileId) {
                    bookmarkListEl.innerHTML = `
                        <div class="bookmark-empty">
                            <i class="fas fa-bookmark"></i>
                            <p>请先选择一个文件<br>再使用书签功能</p>
                        </div>`;
                    addBookmarkBtnEl.disabled = true;
                    return;
                }
                
                addBookmarkBtnEl.disabled = false;
                
                if (list.length === 0) {
                    bookmarkListEl.innerHTML = `
                        <div class="bookmark-empty">
                            <i class="fas fa-bookmark"></i>
                            <p>暂无书签<br>点击上方按钮或按 Ctrl+B<br>添加书签</p>
                        </div>`;
                    return;
                }
                
                bookmarkListEl.innerHTML = '';
                const sorted = [...list].sort((a, b) => a.position - b.position);
                
                sorted.forEach(bm => {
                    const item = document.createElement('div');
                    item.className = 'bookmark-item';
                    item.dataset.id = bm.id;
                    
                    const pos = bm.position;
                    const text = contentEl.value ? contentEl.value.substring(0, pos) : '';
                    const line = (text.match(/\n/g) || []).length + 1;
                    const previewText = bm.preview || '';
                    
                    item.innerHTML = `
                        <div class="bookmark-item-top">
                            <div class="bookmark-name" title="点击跳转到此处">${escapeHtml(bm.name)}</div>
                            <div class="bookmark-actions">
                                <button class="bookmark-action-btn rename" title="重命名"><i class="fas fa-pen"></i></button>
                                <button class="bookmark-action-btn delete" title="删除"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="bookmark-preview">${escapeHtml(previewText)}</div>
                        <div class="bookmark-meta"><i class="fas fa-map-pin"></i> 第 ${line} 行</div>
                    `;
                    
                    item.querySelector('.bookmark-name').addEventListener('click', (e) => {
                        e.stopPropagation();
                        jumpToBookmark(bm);
                    });
                    
                    item.querySelector('.rename').addEventListener('click', (e) => {
                        e.stopPropagation();
                        startRenameBookmark(bm.id, item);
                    });
                    
                    item.querySelector('.delete').addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteBookmark(bm.id);
                    });
                    
                    bookmarkListEl.appendChild(item);
                });
            }
            
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
            
            function getPreviewText(position) {
                const text = contentEl.value;
                let preview = text.substring(position, position + 30).replace(/\n/g, ' ').trim();
                if (text.length > position + 30) preview += '...';
                return preview || '(空行)';
            }
            
            function getDefaultBookmarkName(pos) {
                if (typeof pos !== 'number') pos = contentEl.selectionStart;
                const text = contentEl.value.substring(0, pos);
                const line = (text.match(/\n/g) || []).length + 1;
                const preview = getPreviewText(pos);
                return `第${line}行: ${preview.substring(0, 15)}`;
            }
            
            function openAddBookmarkModal() {
                if (!currentFileId) {
                    showNotification('请先选择或创建一个文件', 'warning');
                    return;
                }
                let position, scrollTop;
                if (isEditMode) {
                    position = contentEl.selectionStart;
                    scrollTop = contentEl.scrollTop;
                } else {
                    position = findCharAtPixel(contentEl.scrollTop + 4);
                    scrollTop = contentEl.scrollTop;
                }
                pendingBookmarkPosition = { position, scrollTop };
                bookmarkNameInputEl.value = getDefaultBookmarkName(position);
                bookmarkModalEl.classList.add('show');
                setTimeout(() => {
                    bookmarkNameInputEl.focus();
                    bookmarkNameInputEl.select();
                }, 100);
            }
            
            function closeAddBookmarkModal() {
                bookmarkModalEl.classList.remove('show');
                pendingBookmarkPosition = null;
            }
            
            function addBookmark(name) {
                if (!pendingBookmarkPosition || !currentFileId) return;
                
                const bm = {
                    id: 'bm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                    name: name.trim() || getDefaultBookmarkName(pendingBookmarkPosition.position),
                    position: pendingBookmarkPosition.position,
                    scrollTop: pendingBookmarkPosition.scrollTop,
                    preview: getPreviewText(pendingBookmarkPosition.position),
                    createdAt: Date.now()
                };
                
                if (!bookmarks[currentFileId]) bookmarks[currentFileId] = [];
                bookmarks[currentFileId].push(bm);
                
                // 同步到数据库
                saveBookmarksToDB(currentFileId);
                
                renderBookmarkList();
                closeAddBookmarkModal();
                showNotification('书签已添加', 'success');
            }
            
            function deleteBookmark(bmId) {
                if (!currentFileId || !bookmarks[currentFileId]) return;
                bookmarks[currentFileId] = bookmarks[currentFileId].filter(b => b.id !== bmId);
                
                // 同步到数据库
                saveBookmarksToDB(currentFileId);
                
                renderBookmarkList();
                showNotification('书签已删除', 'success');
            }
            
            function startRenameBookmark(bmId, itemEl) {
                if (!currentFileId || !bookmarks[currentFileId]) return;
                const bm = bookmarks[currentFileId].find(b => b.id === bmId);
                if (!bm) return;
                
                const nameDiv = itemEl.querySelector('.bookmark-name');
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'bookmark-name-input';
                input.value = bm.name;
                nameDiv.replaceWith(input);
                input.focus();
                input.select();
                
                const finish = (save) => {
                    if (save) {
                        const newName = input.value.trim();
                        if (newName) {
                            bm.name = newName;
                            // 同步到数据库
                            saveBookmarksToDB(currentFileId);
                        }
                    }
                    renderBookmarkList();
                };
                
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        finish(true);
                    } else if (e.key === 'Escape') {
                        finish(false);
                    }
                });
                input.addEventListener('blur', () => finish(true));
            }
            
            function jumpToBookmark(bm) {
                if (!contentEl.value) return;
                
                const pos = Math.max(0, Math.min(bm.position, contentEl.value.length));
                
                if (isEditMode) {
                    contentEl.focus();
                    try { contentEl.setSelectionRange(pos, pos); } catch(e) {}
                    requestAnimationFrame(() => {
                        scrollToCharPos(pos, 24);
                        saveCurrentPosition();
                    });
                } else {
                    scrollToCharPos(pos, 24);
                    setTimeout(saveCurrentPosition, 450);
                }
                
                updateCursorInfo();
                showBookmarkFlash(bm.name);
            }
            
            function setupBookmarkEventListeners() {
                bookmarkToggleEl.addEventListener('click', () => {
                    bookmarkPanelEl.classList.toggle('open');
                    bookmarkToggleEl.classList.toggle('active');
                    if (bookmarkPanelEl.classList.contains('open')) {
                        renderBookmarkList();
                    }
                });
                
                closeBookmarkEl.addEventListener('click', () => {
                    bookmarkPanelEl.classList.remove('open');
                    bookmarkToggleEl.classList.remove('active');
                });
                
                addBookmarkBtnEl.addEventListener('click', openAddBookmarkModal);
                
                bookmarkConfirmEl.addEventListener('click', () => {
                    addBookmark(bookmarkNameInputEl.value);
                });
                
                bookmarkCancelEl.addEventListener('click', closeAddBookmarkModal);
                
                bookmarkNameInputEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addBookmark(bookmarkNameInputEl.value);
                    } else if (e.key === 'Escape') {
                        closeAddBookmarkModal();
                    }
                });
                
                bookmarkModalEl.addEventListener('click', (e) => {
                    if (e.target === bookmarkModalEl) {
                        closeAddBookmarkModal();
                    }
                });
            }
            
            // ========== 文件核心功能 ==========
            
            function updateCharCount() {
                charCountEl.textContent = contentEl.value.length;
            }
            
            async function loadFiles() {
                try {
                    const { data, error } = await supabase
                        .from('text_files')
                        .select('*')
                        .order('updated_at', { ascending: false });
                    
                    if (error) throw error;
                    
                    files = data || [];
                    renderFileList();
                    
                    if (files.length > 0) {
                        await selectFile(files[0].id);
                    } else {
                        showEmptyEditor();
                    }
                } catch (error) {
                    console.error('加载文件列表失败:', error);
                    fileListEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>加载失败</h3>
                            <p>无法从数据库加载文件列表</p>
                        </div>
                    `;
                }
            }
            
            function renderFileList() {
                fileListEl.innerHTML = '';
                
                if (files.length === 0) {
                    fileListEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <h3>暂无文件</h3>
                            <p>点击 + 按钮创建新文件</p>
                        </div>
                    `;
                    return;
                }
                
                const searchTerm = searchInputEl.value.toLowerCase();
                const filteredFiles = files.filter(file => 
                    file.filename.toLowerCase().includes(searchTerm)
                );
                
                if (filteredFiles.length === 0) {
                    fileListEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-search"></i>
                            <h3>未找到匹配文件</h3>
                            <p>请尝试其他搜索词</p>
                        </div>
                    `;
                    return;
                }
                
                filteredFiles.forEach(file => {
                    const fileItem = document.createElement('div');
                    fileItem.className = `file-item ${currentFileId === file.id ? 'active' : ''}`;
                    fileItem.dataset.id = file.id;
                    
                    const isEditing = editingFileId === file.id;
                    
                    fileItem.innerHTML = `
                        <div class="file-name-container">
                            ${isEditing ? 
                                `<input type="text" class="file-name-input" value="${file.filename}" data-id="${file.id}">` : 
                                `<div class="file-name">${file.filename}</div>`
                            }
                        </div>
                        <div class="file-actions">
                            <button class="action-btn edit-btn" title="编辑文件名">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete-btn" title="删除文件">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                    
                    fileItem.addEventListener('click', (e) => {
                        if (e.target.closest('.action-btn') || e.target.classList.contains('file-name-input')) {
                            return;
                        }
                        selectFile(file.id);
                        if (window.innerWidth <= 768) {
                            sidebarEl.classList.add('sidebar-collapsed');
                        }
                    });
                    
                    fileItem.querySelector('.edit-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        startEditing(file.id);
                    });
                    
                    fileItem.querySelector('.delete-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteFile(file.id);
                    });
                    
                    if (isEditing) {
                        const inputEl = fileItem.querySelector('.file-name-input');
                        inputEl.focus();
                        inputEl.select();
                        
                        inputEl.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                finishEditing(file.id, inputEl.value);
                            } else if (e.key === 'Escape') {
                                cancelEditing(file.id);
                            }
                        });
                        
                        inputEl.addEventListener('blur', () => {
                            finishEditing(file.id, inputEl.value);
                        });
                    }
                    
                    fileListEl.appendChild(fileItem);
                });
            }
            
            function startEditing(fileId) {
                editingFileId = fileId;
                renderFileList();
            }
            
            async function finishEditing(fileId, newName) {
                if (!newName.trim()) {
                    showNotification('文件名不能为空', 'warning');
                    return;
                }
                
                const file = files.find(f => f.id === fileId);
                if (!file) return;
                
                if (file.filename === newName) {
                    cancelEditing(fileId);
                    return;
                }
                
                try {
                    if (fileId.startsWith('new-')) {
                        file.filename = newName;
                        cancelEditing(fileId);
                        if (currentFileId === fileId) {
                            currentFilenameEl.textContent = newName;
                            updateModeIndicator(isEditMode ? 'edit' : 'read');
                        }
                        showNotification('文件名已更新', 'success');
                        return;
                    }
                    
                    const { error } = await supabase
                        .from('text_files')
                        .update({ filename: newName })
                        .eq('id', fileId);
                    
                    if (error) throw error;
                    
                    file.filename = newName;
                    cancelEditing(fileId);
                    
                    if (currentFileId === fileId) {
                        currentFilenameEl.textContent = newName;
                        updateModeIndicator(isEditMode ? 'edit' : 'read');
                    }
                    
                    showNotification('文件名更新成功', 'success');
                } catch (error) {
                    console.error('更新文件名失败:', error);
                    showNotification('文件名更新失败: ' + error.message, 'error');
                    cancelEditing(fileId);
                }
            }
            
            function cancelEditing(fileId) {
                editingFileId = null;
                renderFileList();
            }
            
            async function selectFile(fileId) {
                // 切换前保存当前文件的位置和书签
                saveCurrentPosition();
                if (currentFileId) {
                    await saveBookmarksToDB(currentFileId);
                }
                
                currentFileId = fileId;
                const file = files.find(f => f.id === fileId);
                if (!file) return;
                
                renderFileList();
                
                currentFilenameEl.textContent = file.filename;
                contentEl.value = file.content || '';
                updateCharCount();
                updateCursorInfo();
                editModeBtnEl.disabled = false;
                
                setReadMode();
                
                // 加载当前文件的书签
                bookmarks[fileId] = await loadBookmarksFromDB(fileId);
                renderBookmarkList();
                restorePosition(fileId);
            }
            
            function showEmptyEditor() {
                currentFileId = null;
                currentFilenameEl.textContent = '选择或创建新文本';
                contentEl.value = '';
                updateCharCount();
                updateCursorInfo();
                editModeBtnEl.disabled = true;
                saveBtnEl.disabled = true;
                isEditMode = false;
                contentEl.readOnly = true;
                textEditorEl.classList.remove('edit-mode', 'read-mode');
                const oldIndicator = currentFilenameEl.querySelector('.mode-indicator');
                if (oldIndicator) oldIndicator.remove();
                readModeTipEl.classList.remove('show');
                renderBookmarkList();
            }
            
            function createNewFile() {
                saveCurrentPosition();
                
                const newFile = {
                    id: 'new-' + Date.now(),
                    filename: '新文件_' + new Date().toLocaleDateString(),
                    content: ''
                };
                
                files.unshift(newFile);
                currentFileId = newFile.id;
                bookmarks[newFile.id] = []; // 初始化空书签
                
                renderFileList();
                
                currentFilenameEl.textContent = newFile.filename;
                contentEl.value = '';
                updateCharCount();
                updateCursorInfo();
                editModeBtnEl.disabled = false;
                
                fileListEl.scrollTop = 0;
                
                setEditMode();
                contentEl.scrollTop = 0;
                renderBookmarkList();
            }
            
            async function saveFile() {
                if (!isEditMode) return;
                const file = files.find(f => f.id === currentFileId);
                if (!file) return;
                
                const filename = file.filename;
                const content = contentEl.value;
                saveCurrentPosition();
                
                try {
                    let result;
                    let newId = null;
                    
                    if (file.id.startsWith('new-')) {
                        result = await supabase
                            .from('text_files')
                            .insert([{ filename, content }])
                            .select();
                    } else {
                        result = await supabase
                            .from('text_files')
                            .update({
                                content,
                                updated_at: new Date().toISOString()
                            })
                            .eq('id', currentFileId)
                            .select();
                    }
                    
                    const { data, error } = result;
                    if (error) throw error;
                    
                    // 新文件保存后，迁移书签到数据库
                    if (file.id.startsWith('new-') && data && data.length > 0) {
                        newId = data[0].id;
                        if (bookmarks[file.id]) {
                            bookmarks[newId] = bookmarks[file.id];
                            delete bookmarks[file.id];
                            await saveBookmarksToDB(newId);
                            // 清理临时localStorage
                            try { localStorage.removeItem(`textBookmarks_${file.id}`); } catch(e) {}
                        }
                        // 迁移阅读位置
                        try {
                            const oldKey = `textPosition_${file.id}`;
                            const oldPos = localStorage.getItem(oldKey);
                            if (oldPos) {
                                localStorage.setItem(`textPosition_${newId}`, oldPos);
                                localStorage.removeItem(oldKey);
                            }
                        } catch(e) {}
                    } else {
                        // 已有文件保存时同步书签
                        await saveBookmarksToDB(currentFileId);
                    }
                    
                    // 保存当前滚动位置
                    const savedScrollTop = contentEl.scrollTop;
                    const savedSelStart = contentEl.selectionStart;
                    const savedSelEnd = contentEl.selectionEnd;
                    
                    await loadFiles();
                    
                    if (newId) {
                        currentFileId = newId;
                        renderFileList();
                        currentFilenameEl.textContent = filename;
                        contentEl.value = content;
                        updateCharCount();
                        setReadMode();
                        renderBookmarkList();
                        requestAnimationFrame(() => {
                            isRestoringPosition = true;
                            contentEl.scrollTop = savedScrollTop;
                            updateCursorInfo();
                            setTimeout(() => { isRestoringPosition = false; }, 100);
                        });
                    } else {
                        setReadMode();
                    }
                    
                    showNotification('文件保存成功，已返回阅读模式', 'success');
                } catch (error) {
                    console.error('保存文件失败:', error);
                    showNotification('保存失败: ' + error.message, 'error');
                }
            }
            
            async function deleteFile(fileId) {
                if (!confirm('确定要删除这个文件吗？此操作不可撤销。')) return;
                
                try {
                    if (fileId.startsWith('new-')) {
                        files = files.filter(f => f.id !== fileId);
                        renderFileList();
                        if (currentFileId === fileId) {
                            currentFileId = null;
                            showEmptyEditor();
                        }
                        // 清理临时数据
                        delete bookmarks[fileId];
                        try { localStorage.removeItem(`textBookmarks_${fileId}`); } catch(e){}
                        try { localStorage.removeItem(`textPosition_${fileId}`); } catch(e){}
                        showNotification('未保存的文件已删除', 'success');
                        return;
                    }
                    
                    const { error } = await supabase
                        .from('text_files')
                        .delete()
                        .eq('id', fileId);
                    
                    if (error) throw error;
                    
                    if (currentFileId === fileId) {
                        currentFileId = null;
                        showEmptyEditor();
                    }
                    
                    // 数据库级联自动删除书签，只需清理前端内存
                    delete bookmarks[fileId];
                    try { localStorage.removeItem(`textPosition_${fileId}`); } catch(e){}
                    
                    await loadFiles();
                    showNotification('文件删除成功', 'success');
                } catch (error) {
                    console.error('删除文件失败:', error);
                    showNotification('删除失败: ' + error.message, 'error');
                }
            }
            
            function showNotification(message, type = 'info') {
                notificationEl.className = `notification ${type}`;
                let icon = 'fas fa-info-circle';
                if (type === 'success') icon = 'fas fa-check-circle';
                if (type === 'error') icon = 'fas fa-exclamation-circle';
                if (type === 'warning') icon = 'fas fa-exclamation-triangle';
                
                notificationEl.innerHTML = `<i class="${icon}"></i> ${message}`;
                notificationEl.classList.add('show');
                
                setTimeout(() => {
                    notificationEl.classList.remove('show');
                }, 3000);
            }
            
            function setupEventListeners() {
                addFileBtnEl.addEventListener('click', createNewFile);
                saveBtnEl.addEventListener('click', saveFile);
                editModeBtnEl.addEventListener('click', toggleEditMode);
                searchInputEl.addEventListener('input', renderFileList);
                
                toggleSidebarEl.addEventListener('click', () => {
                    sidebarEl.classList.toggle('sidebar-collapsed');
                    toggleSidebarEl.innerHTML = sidebarEl.classList.contains('sidebar-collapsed') ? 
                        '<i class="fas fa-chevron-right"></i>' : '<i class="fas fa-chevron-left"></i>';
                });
                
                mobileMenuBtnEl.addEventListener('click', () => {
                    sidebarEl.classList.toggle('sidebar-collapsed');
                });
                
                document.querySelector('.content-area').addEventListener('click', () => {
                    if (window.innerWidth <= 768 && !sidebarEl.classList.contains('sidebar-collapsed')) {
                        sidebarEl.classList.add('sidebar-collapsed');
                    }
                });
                
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                        e.preventDefault();
                        if (isEditMode && !saveBtnEl.disabled) {
                            saveFile();
                        } else if (!isEditMode && currentFileId) {
                            showNotification('当前为阅读模式，请先点击「编辑」按钮', 'warning');
                        }
                    }
                    // Ctrl+B 添加书签
                    if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
                        e.preventDefault();
                        if (!bookmarkPanelEl.classList.contains('open')) {
                            bookmarkPanelEl.classList.add('open');
                            bookmarkToggleEl.classList.add('active');
                            renderBookmarkList();
                        }
                        openAddBookmarkModal();
                    }
                    // Escape 退出编辑模式
                    if (e.key === 'Escape' && isEditMode) {
                        setReadMode();
                    }
                });
            }
        })();
    </script>
