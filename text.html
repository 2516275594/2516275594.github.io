<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本管理器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: rgba(0, 0, 0, 0.05);
            --sidebar-width: 280px;
            --bookmark-width: 260px;
            --read-bg: #f1f5f9;
            --edit-bg: #ffffff;
            --editor-scrollbar-width: 0px; /* JS运行时会自动测量并写入 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--background);
            color: var(--text);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 1rem 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            padding: 6px 12px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .container {
            display: flex;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            height: calc(100% - 70px);
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
            position: relative;
            z-index: 20;
        }

        /* 侧边栏收起状态：宽度归 0，内容隐藏 */
        .sidebar.collapsed {
            width: 0;
            border-right-color: transparent;
            overflow: hidden;
        }
        .sidebar.collapsed > * {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .sidebar-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            color: var(--text-light);
            font-weight: 500;
        }

        .add-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            background-color: var(--primary-dark);
            transform: rotate(90deg);
        }

        .search-container {
            padding: 0.5rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 2rem 0.6rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
        }

        .file-item {
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.4rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid transparent;
        }

        .file-item:hover {
            background-color: #f1f5f9;
        }

        .file-item.active {
            background-color: #eef2ff;
            border-left-color: var(--primary);
        }

        .file-name-container {
            display: flex;
            align-items: center;
            flex: 1;
            overflow: hidden;
        }

        .file-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            padding-right: 10px;
        }

        .file-name-input {
            flex: 1;
            padding: 0.3rem 0.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.95rem;
            background: white;
            color: var(--text);
            outline: none;
        }

        .file-name-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .file-actions {
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .file-item:hover .file-actions {
            opacity: 1;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: #f1f5f9;
            color: var(--primary);
        }

        .delete-btn:hover {
            color: var(--error);
            background-color: #fee2e2;
        }

        .edit-btn:hover {
            color: var(--primary-dark);
            background-color: #e0e7ff;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            min-width: 0;
        }

        .content-header {
            padding: 1rem 1.5rem;
            padding-left: 52px; /* 为左侧的折叠按钮让出位置 */
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .content-header h2 {
            font-size: 1.3rem;
            color: var(--text);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 70%;
        }

        .mode-indicator {
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            margin-left: 10px;
            font-weight: 500;
            vertical-align: middle;
        }

        .mode-indicator.read-mode {
            background-color: #e2e8f0;
            color: #64748b;
        }

        .mode-indicator.edit-mode {
            background-color: #fef3c7;
            color: #92400e;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.5rem 0.7rem;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background-color: #f1f5f9;
            color: var(--primary);
        }

        .icon-btn.active {
            background-color: #eef2ff;
            color: var(--primary);
        }

        .icon-btn .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--error);
            color: white;
            font-size: 0.65rem;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3px;
        }

        .icon-btn-wrapper {
            position: relative;
            display: inline-block;
        }

        /* 编辑按钮 */
        .edit-mode-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 0.5rem 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .edit-mode-btn:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }

        .edit-mode-btn.editing {
            background-color: var(--warning);
        }

        .edit-mode-btn.editing:hover {
            background-color: #d97706;
        }

        .edit-mode-btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }

        .save-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .save-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .save-btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }

        .editor-container {
            flex: 1;
            display: flex;
            padding: 0;
            overflow: hidden;
            position: relative;
            background-color: var(--read-bg);
        }

        /* 编辑器视口：侧边栏收起/展开时，保持 textarea 的逻辑排版宽度不变，
           只通过 transform: scale() 等比放大/缩小，从而保证"每行显示哪些文字"完全不变——
           不会因宽度变化重新折行，书签定位也不会因侧栏开关而错乱 */
        .editor-viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: stretch;
            min-width: 0;
            min-height: 0;
        }

        .editor-scaler {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            transition: transform 0.3s ease;
            will-change: transform;
            display: flex;
            flex-direction: column;
            /* width/height 由 JS 动态设置，默认先铺满（侧边栏展开状态 scale=1） */
        }

        .text-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--card-bg);
            min-width: 0;
            min-height: 0;
            transition: background-color 0.3s ease;
        }

        /* 阅读模式样式 */
        .text-editor.read-mode {
            background-color: var(--read-bg);
        }

        .text-editor.edit-mode {
            background-color: var(--edit-bg);
            box-shadow: inset 0 0 0 2px var(--warning);
        }

        .text-editor textarea {
            flex: 1;
            padding: 1.5rem;
            border: none;
            font-size: 1rem;
            line-height: 1.7;
            resize: none;
            background: transparent;
            color: var(--text);
            font-family: 'Consolas', 'Monaco', 'Courier New', 'Microsoft YaHei', monospace;
            tab-size: 4;
            transition: background-color 0.3s ease;
            /* 禁止 transform 下文本模糊的提示（浏览器原生已处理） */
        }

        .text-editor.read-mode textarea {
            cursor: default;
            background-color: var(--read-bg);
            opacity: 0.85;
        }

        .text-editor.edit-mode textarea {
            cursor: text;
            background-color: white;
        }

        .text-editor textarea:focus {
            outline: none;
        }

        .editor-footer {
            padding: 0.8rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            flex-shrink: 0;
        }

        /* 阅读模式遮罩提示 */
        .read-mode-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-light);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 5;
        }

        .text-editor.read-mode .read-mode-tip.show {
            opacity: 0.6;
        }

        .read-mode-tip i {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: #94a3b8;
        }

        .read-mode-tip p {
            font-size: 0.95rem;
        }

        .char-count {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .cursor-info {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        /* 书签面板样式：悬浮层，打开/关闭时不改变正文宽度，避免文本重新换行导致书签错位 */
        .bookmark-panel {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: var(--bookmark-width);
            max-width: 85%;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateX(101%);
            transition: transform 0.28s ease, box-shadow 0.28s ease;
            z-index: 50; /* 高于 editor-scaler，避免被缩放层遮挡 */
            box-shadow: none;
            will-change: transform;
        }

        .bookmark-panel.open {
            transform: translateX(0);
            box-shadow: -8px 0 24px rgba(0, 0, 0, 0.12);
        }

        /* 书签跳转后的定位提示条 */
        .bookmark-flash {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%) translateY(-6px);
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 6px 18px rgba(217, 119, 6, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 40;
            max-width: 70%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bookmark-flash.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .bookmark-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
        }

        .bookmark-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bookmark-header-actions {
            display: flex;
            gap: 5px;
        }

        .bookmark-header button {
            background: rgba(255,255,255,0.6);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            color: #92400e;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .bookmark-header button:hover {
            background: white;
        }

        .add-bookmark-btn {
            padding: 0.75rem 1rem;
            margin: 0.75rem;
            background: linear-gradient(135deg, var(--warning), #d97706);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .add-bookmark-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .add-bookmark-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .bookmark-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0.75rem;
        }

        .bookmark-item {
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #fffbeb;
            border-left: 3px solid var(--warning);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bookmark-item:hover {
            background-color: #fef3c7;
            transform: translateX(-2px);
        }

        .bookmark-item-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .bookmark-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: #78350f;
            flex: 1;
            word-break: break-word;
            padding-right: 8px;
            cursor: pointer;
        }

        .bookmark-name-input {
            flex: 1;
            padding: 0.2rem 0.4rem;
            border: 1px solid var(--warning);
            border-radius: 4px;
            font-size: 0.9rem;
            background: white;
            color: var(--text);
            outline: none;
            margin-right: 8px;
        }

        .bookmark-actions {
            display: flex;
            gap: 2px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .bookmark-item:hover .bookmark-actions {
            opacity: 1;
        }

        .bookmark-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 4px;
            color: #92400e;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .bookmark-action-btn:hover {
            background: white;
        }

        .bookmark-action-btn.delete:hover {
            color: var(--error);
        }

        .bookmark-preview {
            font-size: 0.78rem;
            color: var(--text-light);
            font-style: italic;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        .bookmark-meta {
            font-size: 0.72rem;
            color: #b45309;
        }

        .bookmark-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: var(--text-light);
            text-align: center;
            gap: 8px;
        }

        .bookmark-empty i {
            font-size: 2rem;
            color: #fcd34d;
        }

        .bookmark-empty p {
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* 书签命名弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.2s;
        }

        .modal-overlay.show .modal {
            transform: translateY(0);
        }

        .modal h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }

        .modal input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            border: none;
            transition: all 0.2s;
        }

        .modal-btn.cancel {
            background: #f1f5f9;
            color: var(--text);
        }

        .modal-btn.cancel:hover {
            background: #e2e8f0;
        }

        .modal-btn.confirm {
            background: var(--primary);
            color: white;
        }

        .modal-btn.confirm:hover {
            background: var(--primary-dark);
        }

        /* 左侧边缘的侧边栏折叠按钮 */
        .toggle-sidebar {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--primary);
            cursor: pointer;
            font-size: 0.95rem;
            width: 32px;
            height: 40px;
            border-radius: 0 8px 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 15;

            }

            // ========== 阅读/编辑模式切换 ==========
            
            function setReadMode() {
                isEditMode = false;
                contentEl.readOnly = true;
                textEditorEl.classList.remove('edit-mode');
                textEditorEl.classList.add('read-mode');
                editModeBtnEl.classList.remove('editing');
                editModeBtnEl.innerHTML = '<i class="fas fa-pen"></i> <span>编辑</span>';
                editModeBtnEl.title = '点击进入编辑模式';
                saveBtnEl.disabled = true;
                
                // 更新文件名旁的模式标记
                updateModeIndicator('read');
                
                // 空内容时显示提示
                if (currentFileId && (!contentEl.value || contentEl.value.trim() === '')) {
                    readModeTipEl.classList.add('show');
                } else {
                    readModeTipEl.classList.remove('show');
                }
            }
            
            function setEditMode() {
                if (!currentFileId) {
                    showNotification('请先选择或创建一个文件', 'warning');
                    return;
                }
                isEditMode = true;
                contentEl.readOnly = false;
                textEditorEl.classList.remove('read-mode');
                textEditorEl.classList.add('edit-mode');
                editModeBtnEl.classList.add('editing');
                editModeBtnEl.innerHTML = '<i class="fas fa-check"></i> <span>完成</span>';
                editModeBtnEl.title = '点击退出编辑模式';
                saveBtnEl.disabled = false;
                readModeTipEl.classList.remove('show');
                
                // 更新文件名旁的模式标记
                updateModeIndicator('edit');
                
                // 聚焦到编辑器末尾
                contentEl.focus();
                const end = contentEl.value.length;
                contentEl.setSelectionRange(end, end);
                updateCursorInfo();
            }

            function updateModeIndicator(mode) {
                // 移除旧的标记
                const oldIndicator = currentFilenameEl.querySelector('.mode-indicator');
                if (oldIndicator) oldIndicator.remove();
                
                // 添加新标记
                const indicator = document.createElement('span');
                indicator.className = `mode-indicator ${mode}-mode`;
                indicator.textContent = mode === 'read' ? '阅读模式' : '编辑模式';
                currentFilenameEl.appendChild(indicator);
            }
            
            function toggleEditMode() {
                if (isEditMode) {
                    // 如果有未保存的修改，提示用户
                    // 这里简单处理：直接切换，用户可以选择保存
                    setReadMode();
                    showNotification('已退出编辑模式，未保存的修改不会丢失，请点击保存', 'info');
                } else {
                    setEditMode();
                    showNotification('已进入编辑模式，可以开始修改', 'success');
                }
            }
            
            // ========== 文本排版测量（书签 / 位置精确定位的基础） ==========
            // textarea 中过长的行会自动换行，若只按换行符数量估算行号，跳转就会错位；
            // 尤其在书签面板开合、窗口尺寸变化时更明显。
            // 这里用一个与 textarea 字体、字号、行高、内边距、宽度完全一致的隐藏镜像元素，
            // 测量任意字符位置的真实像素纵向偏移，保证"跳到第几行"永远精确。

            function ensureMeasureMirror() {
                if (!measureMirrorEl || !document.body.contains(measureMirrorEl)) {
                    measureMirrorEl = document.createElement('div');
                    measureMirrorEl.setAttribute('aria-hidden', 'true');
                    measureTextEl = document.createElement('span');
                    measureMarkerEl = document.createElement('span');
                    measureMarkerEl.textContent = '\u200b';
                    measureMirrorEl.appendChild(measureTextEl);
                    measureMirrorEl.appendChild(measureMarkerEl);
                    const s = measureMirrorEl.style;
                    s.position = 'absolute';
                    s.top = '0';
                    s.left = '-99999px';
                    s.visibility = 'hidden';
                    s.pointerEvents = 'none';
                    s.zIndex = '-1';
                    s.margin = '0';
                    s.border = '0';
                    s.boxSizing = 'border-box';
                    s.height = 'auto';
                    s.overflow = 'hidden';
                    document.body.appendChild(measureMirrorEl);
                }
                syncMeasureMirrorStyle();
                return measureMirrorEl;
            }

            function syncMeasureMirrorStyle() {
                const cs = window.getComputedStyle(contentEl);
                const s = measureMirrorEl.style;
                // 镜像为 border-box 且无边框，宽度取 textarea 的 clientWidth，
                // 使其内容宽度 = clientWidth - 左右内边距，与 textarea 的换行宽度一致
                s.width = contentEl.clientWidth + 'px';
                s.paddingTop = cs.paddingTop;
                s.paddingRight = cs.paddingRight;
                s.paddingBottom = cs.paddingBottom;
                s.paddingLeft = cs.paddingLeft;
                s.fontFamily = cs.fontFamily;
                s.fontSize = cs.fontSize;
                s.fontWeight = cs.fontWeight;
                s.fontStyle = cs.fontStyle;
                s.lineHeight = cs.lineHeight;
                s.letterSpacing = cs.letterSpacing;
                s.wordSpacing = cs.wordSpacing;
                s.textIndent = cs.textIndent;
                s.textTransform = cs.textTransform;
                s.textAlign = cs.textAlign;
                s.direction = cs.direction;
                s.tabSize = cs.tabSize;
                s.whiteSpace = 'pre-wrap';
                s.overflowWrap = 'break-word';
                s.wordBreak = 'break-word';
            }

            // 返回字符位置 pos 距 textarea 内容区顶部的像素距离（已包含自动换行的影响）
            function measureCharTop(pos) {
                const value = contentEl.value;
                const p = Math.max(0, Math.min(pos, value.length));
                ensureMeasureMirror();
                measureTextEl.textContent = value.substring(0, p);
                const mirrorRect = measureMirrorEl.getBoundingClientRect();
                const markerRect = measureMarkerEl.getBoundingClientRect();
                return markerRect.top - mirrorRect.top;
            }

            // 反查：纵向像素位置 pixelY 对应的字符位置（阅读模式在屏幕顶部加书签时用）
            function findCharAtPixel(pixelY) {
                const value = contentEl.value;
                if (!value) return 0;
                let lo = 0, hi = value.length, best = 0;
                while (lo <= hi) {
                    const mid = (lo + hi) >> 1;
                    if (measureCharTop(mid) <= pixelY) {
                        best = mid;
                        lo = mid + 1;
                    } else {
                        hi = mid - 1;
                    }
                }
                return best;
            }

            function getMaxScroll() {
                return Math.max(0, contentEl.scrollHeight - contentEl.clientHeight);
            }

            // 把某个字符位置滚动到视口靠上位置（gap 为距顶部的留白）
            function scrollToCharPos(pos, gap) {
                if (typeof gap !== 'number') gap = 24;
                const charTop = measureCharTop(pos);
                const target = Math.max(0, Math.min(charTop - gap, getMaxScroll()));
                isRestoringPosition = true;
                contentEl.scrollTo({ top: target, behavior: 'smooth' });
                setTimeout(() => { isRestoringPosition = false; }, 400);
                return target;
            }

            function showBookmarkFlash(name) {
                if (!bookmarkFlashEl) {
                    bookmarkFlashEl = document.createElement('div');
                    bookmarkFlashEl.className = 'bookmark-flash';
                    const host = document.getElementById('text-editor');
                    if (host) host.appendChild(bookmarkFlashEl);
                }
                bookmarkFlashEl.innerHTML = '<i class="fas fa-bookmark"></i> 已定位：' + escapeHtml(name || '书签');
                bookmarkFlashEl.classList.add('show');
                clearTimeout(bookmarkFlashEl._timer);
                bookmarkFlashEl._timer = setTimeout(() => {
                    bookmarkFlashEl.classList.remove('show');
                }, 1800);
            }

            // ========== 位置记忆功能 ==========
            
            function saveCurrentPosition() {
                if (!currentFileId) return;
                try {
                    const key = `textPosition_${currentFileId}`;
                    const maxScroll = getMaxScroll();
                    const data = {
                        scrollTop: contentEl.scrollTop,
                        maxScroll: maxScroll,
                        ratio: maxScroll > 0 ? contentEl.scrollTop / maxScroll : 0,
                        selectionStart: contentEl.selectionStart,
                        selectionEnd: contentEl.selectionEnd,
                        timestamp: Date.now()
                    };
                    localStorage.setItem(key, JSON.stringify(data));
                } catch(e) { /* ignore */ }
            }
            
            function restorePosition(fileId) {
                try {
                    const key = `textPosition_${fileId}`;
                    const saved = localStorage.getItem(key);
                    if (!saved) {
                        contentEl.scrollTop = 0;
                        return;
                    }
                    const data = JSON.parse(saved);
                    
                    // 延迟设置，等textarea内容渲染完成
                    requestAnimationFrame(() => {
                        isRestoringPosition = true;
                        const maxScrollNow = getMaxScroll();
                        let target = data.scrollTop || 0;
                        // 若可滚动高度与上次不同（换行方式或窗口尺寸变化），按比例还原，避免完全跑偏
                        if (typeof data.maxScroll === 'number' && Math.abs(maxScrollNow - data.maxScroll) > 2) {
                            target = (data.ratio || 0) * maxScrollNow;
                        }
                        contentEl.scrollTop = Math.max(0, Math.min(target, maxScrollNow));
                        // 阅读模式下不设置光标，避免默认选中
                        if (isEditMode && typeof data.selectionStart === 'number') {
                            try {
                                contentEl.setSelectionRange(
                                    Math.min(data.selectionStart, contentEl.value.length),
                                    Math.min(data.selectionEnd || data.selectionStart, contentEl.value.length)
                                );
                            } catch(e) {}
                        }
                        updateCursorInfo();
                        setTimeout(() => { isRestoringPosition = false; }, 100);
                    });
                } catch(e) {
                    isRestoringPosition = false;
                }
            }
            
            function updateCursorInfo() {
                if (!contentEl) return;
                const pos = contentEl.selectionStart;
                const text = contentEl.value.substring(0, pos);
                const line = (text.match(/\n/g) || []).length + 1;
                const lastNewline = text.lastIndexOf('\n');
                const col = pos - lastNewline;
                cursorInfoEl.textContent = `行 ${line}, 列 ${col}`;
            }
            
            // ========== 书签功能 ==========
            
            function loadBookmarksFromStorage() {
                try {
                    const saved = localStorage.getItem('textBookmarks');
                    if (saved) {
                        bookmarks = JSON.parse(saved);
                    }
                } catch(e) { bookmarks = {}; }
            }
            
            function saveBookmarksToStorage() {
                try {
                    localStorage.setItem('textBookmarks', JSON.stringify(bookmarks));
                } catch(e) {}
            }
            
            function getCurrentFileBookmarks() {
                if (!currentFileId) return [];
                return bookmarks[currentFileId] || [];
            }
            
            function updateBookmarkBadge() {
                const list = getCurrentFileBookmarks();
                if (list.length > 0) {
                    bookmarkCountEl.textContent = list.length;
                    bookmarkCountEl.style.display = 'flex';
                } else {
                    bookmarkCountEl.style.display = 'none';
                }
            }
            
            function renderBookmarkList() {
                const list = getCurrentFileBookmarks();
                updateBookmarkBadge();
                
                if (!currentFileId || !currentFileId) {
                    bookmarkListEl.innerHTML = `
                        <div class="bookmark-empty">
                            <i class="fas fa-bookmark"></i>
                            <p>请先选择一个文件<br>再使用书签功能</p>
                        </div>`;
                    addBookmarkBtnEl.disabled = true;
                    return;
                }
                
                addBookmarkBtnEl.disabled = false;
                
                if (list.length === 0) {
                    bookmarkListEl.innerHTML = `
                        <div class="bookmark-empty">
                            <i class="fas fa-bookmark"></i>
                            <p>暂无书签<br>点击上方按钮或按 Ctrl+B<br>添加书签</p>
                        </div>`;
                    return;
                }
                
                bookmarkListEl.innerHTML = '';
                // 按位置排序（从上到下）
                const sorted = [...list].sort((a, b) => a.position - b.position);
                
                sorted.forEach(bm => {
                    const item = document.createElement('div');
                    item.className = 'bookmark-item';
                    item.dataset.id = bm.id;
                    
                    const pos = bm.position;
                    const text = contentEl.value ? contentEl.value.substring(0, pos) : '';
                    const line = (text.match(/\n/g) || []).length + 1;
                    
                    const previewText = bm.preview || '';
                    
                    item.innerHTML = `
                        <div class="bookmark-item-top">
                            <div class="bookmark-name" title="点击跳转到此处">${escapeHtml(bm.name)}</div>
                            <div class="bookmark-actions">
                                <button class="bookmark-action-btn rename" title="重命名"><i class="fas fa-pen"></i></button>
                                <button class="bookmark-action-btn delete" title="删除"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="bookmark-preview">${escapeHtml(previewText)}</div>
                        <div class="bookmark-meta"><i class="fas fa-map-pin"></i> 第 ${line} 行</div>
                    `;
                    
                    // 点击书签名称跳转
                    item.querySelector('.bookmark-name').addEventListener('click', (e) => {
                        e.stopPropagation();
                        jumpToBookmark(bm);
                    });
                    
                    // 重命名
                    item.querySelector('.rename').addEventListener('click', (e) => {
                        e.stopPropagation();
                        startRenameBookmark(bm.id, item);
                    });
                    
                    // 删除
                    item.querySelector('.delete').addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteBookmark(bm.id);
                    });
                    
                    bookmarkListEl.appendChild(item);
                });
            }
            
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
            
            function getPreviewText(position) {
                const text = contentEl.value;
                // 取光标位置后20个字符作为预览
                let preview = text.substring(position, position + 30).replace(/\n/g, ' ').trim();
                if (text.length > position + 30) preview += '...';
                return preview || '(空行)';
            }
            
            function getDefaultBookmarkName(pos) {
                if (typeof pos !== 'number') pos = contentEl.selectionStart;
                const text = contentEl.value.substring(0, pos);
                const line = (text.match(/\n/g) || []).length + 1;
                const preview = getPreviewText(pos);
                return `第${line}行: ${preview.substring(0, 15)}`;
            }
            
            function openAddBookmarkModal() {
                if (!currentFileId) {
                    showNotification('请先选择或创建一个文件', 'warning');
                    return;
                }

                // 编辑模式：以光标位置为准
                // 阅读模式：只读无法放置光标，则以"当前屏幕顶部"对应的字符位置为准（精确测量，非估算）
                let position, scrollTop;
                if (isEditMode) {
                    position = contentEl.selectionStart;
                    scrollTop = contentEl.scrollTop;
                } else {
                    position = findCharAtPixel(contentEl.scrollTop + 4);
                    scrollTop = contentEl.scrollTop;
                }

                pendingBookmarkPosition = {
                    position: position,
                    scrollTop: scrollTop
                };
                bookmarkNameInputEl.value = getDefaultBookmarkName(position);
                bookmarkModalEl.classList.add('show');
                setTimeout(() => {
                    bookmarkNameInputEl.focus();
                    bookmarkNameInputEl.select();
                }, 100);
            }
            
            function closeAddBookmarkModal() {
                bookmarkModalEl.classList.remove('show');
                pendingBookmarkPosition = null;
            }
            
            function addBookmark(name) {
                if (!pendingBookmarkPosition || !currentFileId) return;
                
                const bm = {
                    id: 'bm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                    name: name.trim() || getDefaultBookmarkName(pendingBookmarkPosition.position),
                    position: pendingBookmarkPosition.position,
                    scrollTop: pendingBookmarkPosition.scrollTop,
                    preview: getPreviewText(pendingBookmarkPosition.position),
                    createdAt: Date.now()
                };
                
                if (!bookmarks[currentFileId]) {
                    bookmarks[currentFileId] = [];
                }
                bookmarks[currentFileId].push(bm);
                saveBookmarksToStorage();
                renderBookmarkList();
                closeAddBookmarkModal();
                showNotification('书签已添加', 'success');
            }
            
            function deleteBookmark(bmId) {
                if (!currentFileId || !bookmarks[currentFileId]) return;
                bookmarks[currentFileId] = bookmarks[currentFileId].filter(b => b.id !== bmId);
                saveBookmarksToStorage();
                renderBookmarkList();
                showNotification('书签已删除', 'success');
            }
            
            function startRenameBookmark(bmId, itemEl) {
                if (!currentFileId || !bookmarks[currentFileId]) return;
                const bm = bookmarks[currentFileId].find(b => b.id === bmId);
                if (!bm) return;
                
                const nameDiv = itemEl.querySelector('.bookmark-name');
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'bookmark-name-input';
                input.value = bm.name;
                nameDiv.replaceWith(input);
                input.focus();
                input.select();
                
                const finish = (save) => {
                    if (save) {
                        const newName = input.value.trim();
                        if (newName) {
                            bm.name = newName;
                            saveBookmarksToStorage();
                        }
                    }
                    renderBookmarkList();
                };
                
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        finish(true);
                    } else if (e.key === 'Escape') {
                        finish(false);
                    }
                });
                input.addEventListener('blur', () => finish(true));
            }
            
            function jumpToBookmark(bm) {
                if (!contentEl.value) return;
                
                const pos = Math.max(0, Math.min(bm.position, contentEl.value.length));
                
                // 编辑模式下同时把光标放到该位置（并聚焦）
                if (isEditMode) {
                    contentEl.focus();
                    try { contentEl.setSelectionRange(pos, pos); } catch(e) {}
                    requestAnimationFrame(() => {
                        scrollToCharPos(pos, 24);
                        saveCurrentPosition();
                    });
                } else {
                    // 阅读模式下只滚动，不 focus（避免移动端唤起键盘）
                    scrollToCharPos(pos, 24);
                    setTimeout(saveCurrentPosition, 450);
                }
                
                updateCursorInfo();
                showBookmarkFlash(bm.name);
            }
            
            function setupBookmarkEventListeners() {
                // 切换书签面板
                bookmarkToggleEl.addEventListener('click', () => {
                    bookmarkPanelEl.classList.toggle('open');
                    bookmarkToggleEl.classList.toggle('active');
                    if (bookmarkPanelEl.classList.contains('open')) {
                        renderBookmarkList();
                    }
                });
                
                closeBookmarkEl.addEventListener('click', () => {
                    bookmarkPanelEl.classList.remove('open');
                    bookmarkToggleEl.classList.remove('active');
                });
                
                addBookmarkBtnEl.addEventListener('click', openAddBookmarkModal);
                
                bookmarkConfirmEl.addEventListener('click', () => {
                    addBookmark(bookmarkNameInputEl.value);
                });
                
                bookmarkCancelEl.addEventListener('click', closeAddBookmarkModal);
                
                bookmarkNameInputEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addBookmark(bookmarkNameInputEl.value);
                    } else if (e.key === 'Escape') {
                        closeAddBookmarkModal();
                    }
                });
                
                bookmarkModalEl.addEventListener('click', (e) => {
                    if (e.target === bookmarkModalEl) {
                        closeAddBookmarkModal();
                    }
                });
            }
            
            // ========== 原有功能 ==========
            
            function updateCharCount() {
                charCountEl.textContent = contentEl.value.length;
            }
            
            async function loadFiles() {
                try {
                    const { data, error } = await supabase
                        .from('text_files')
                        .select('*')
                        .order('updated_at', { ascending: false });
                    
                    if (error) throw error;
                    
                    files = data || [];
                    renderFileList();
                    
                    if (files.length > 0) {
                        selectFile(files[0].id);
                    } else {
                        showEmptyEditor();
                    }
                } catch (error) {
                    console.error('加载文件列表失败:', error);
                    fileListEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>加载失败</h3>
                            <p>无法从数据库加载文件列表</p>
                        </div>
                    `;
                }
            }
            
            function renderFileList() {
                fileListEl.innerHTML = '';
                
                if (files.length === 0) {
                    fileListEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <h3>暂无文件</h3>
                            <p>点击 + 按钮创建新文件</p>
                        </div>
                    `;
                    return;
                }
                
                const searchTerm = searchInputEl.value.toLowerCase();
                const filteredFiles = files.filter(file => 
                    file.filename.toLowerCase().includes(searchTerm)
                );
                
                if (filteredFiles.length === 0) {
                    fileListEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-search"></i>
                            <h3>未找到匹配文件</h3>
                            <p>请尝试其他搜索词</p>
                        </div>
                    `;
                    return;
                }
                
                filteredFiles.forEach(file => {
                    const fileItem = document.createElement('div');
                    fileItem.className = `file-item ${currentFileId === file.id ? 'active' : ''}`;
                    fileItem.dataset.id = file.id;
                    
                    const isEditing = editingFileId === file.id;
                    
                    fileItem.innerHTML = `
                        <div class="file-name-container">
                            ${isEditing ? 
                                `<input type="text" class="file-name-input" value="${file.filename}" data-id="${file.id}">` : 
                                `<div class="file-name">${file.filename}</div>`
                            }
                        </div>
                        <div class="file-actions">
                            <button class="action-btn edit-btn" title="编辑文件名">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete-btn" title="删除文件">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                    
                    fileItem.addEventListener('click', (e) => {
                        if (e.target.closest('.action-btn') || e.target.classList.contains('file-name-input')) {
                            return;
                        }
                        selectFile(file.id);
                        if (window.innerWidth <= 768) {
                            setSidebarCollapsed(true);
                        }
                    });
                    
                    const editBtn = fileItem.querySelector('.edit-btn');
                    editBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        startEditing(file.id);
                    });
                    
                    const deleteBtn = fileItem.querySelector('.delete-btn');
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteFile(file.id);
                    });
                    
                    if (isEditing) {
                        const inputEl = fileItem.querySelector('.file-name-input');
                        inputEl.focus();
                        inputEl.select();
                        
                        inputEl.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                finishEditing(file.id, inputEl.value);
                            } else if (e.key === 'Escape') {
                                cancelEditing(file.id);
                            }
                        });
                        
                        inputEl.addEventListener('blur', () => {
                            finishEditing(file.id, inputEl.value);
                        });
                    }
                    
                    fileListEl.appendChild(fileItem);
                });
            }
            
            function startEditing(fileId) {
                editingFileId = fileId;
                renderFileList();
            }
            
            async function finishEditing(fileId, newName) {
                if (!newName.trim()) {
                    showNotification('文件名不能为空', 'warning');
                    return;
                }
                
                const file = files.find(f => f.id === fileId);
                if (!file) return;
                
                if (file.filename === newName) {
                    cancelEditing(fileId);
                    return;
                }
                
                try {
                    if (fileId.startsWith('new-')) {
                        file.filename = newName;
                        cancelEditing(fileId);
                        if (currentFileId === fileId) {
                            currentFilenameEl.textContent = newName;
                            updateModeIndicator(isEditMode ? 'edit' : 'read');
                        }
                        showNotification('文件名已更新', 'success');
                        return;
                    }
                    
                    const { error } = await supabase
                        .from('text_files')
                        .update({ filename: newName })
                        .eq('id', fileId);
                    
                    if (error) throw error;
                    
                    file.filename = newName;
                    cancelEditing(fileId);
                    
                    if (currentFileId === fileId) {
                        currentFilenameEl.textContent = newName;
                        updateModeIndicator(isEditMode ? 'edit' : 'read');
                    }
                    
                    showNotification('文件名更新成功', 'success');
                } catch (error) {
                    console.error('更新文件名失败:', error);
                    showNotification('文件名更新失败: ' + error.message, 'error');
                    cancelEditing(fileId);
                }
            }
            
            function cancelEditing(fileId) {
                editingFileId = null;
                renderFileList();
            }
            
            function selectFile(fileId) {
                // 先保存当前文件的位置
                saveCurrentPosition();
                
                currentFileId = fileId;
                const file = files.find(f => f.id === fileId);
                
                if (!file) return;
                
                renderFileList();
                
                currentFilenameEl.textContent = file.filename;
                contentEl.value = file.content || '';
                updateCharCount();
                updateCursorInfo();
                
                editModeBtnEl.disabled = false;
                
                // 默认进入阅读模式
                setReadMode();
                
                // 渲染书签并恢复位置
                renderBookmarkList();
                restorePosition(fileId);
            }
            
            function showEmptyEditor() {
                currentFileId = null;
                currentFilenameEl.textContent = '选择或创建新文本';
                contentEl.value = '';
                updateCharCount();
                updateCursorInfo();
                editModeBtnEl.disabled = true;
                saveBtnEl.disabled = true;
                isEditMode = false;
                contentEl.readOnly = true;
                textEditorEl.classList.remove('edit-mode', 'read-mode');
                const oldIndicator = currentFilenameEl.querySelector('.mode-indicator');
                if (oldIndicator) oldIndicator.remove();
                readModeTipEl.classList.remove('show');
                renderBookmarkList();
            }
            
            function createNewFile() {
                saveCurrentPosition();
                
                const newFile = {
                    id: 'new-' + Date.now(),
                    filename: '新文件_' + new Date().toLocaleDateString(),
                    content: ''
                };
                
                files.unshift(newFile);
                currentFileId = newFile.id;
                
                renderFileList();
                
                currentFilenameEl.textContent = newFile.filename;
                contentEl.value = '';
                updateCharCount();
                updateCursorInfo();
                
                editModeBtnEl.disabled = false;
                
                fileListEl.scrollTop = 0;
                
                // 新建文件自动进入编辑模式
                setEditMode();
                contentEl.scrollTop = 0;
                renderBookmarkList();
            }
            
            async function saveFile() {
                if (!isEditMode) return;

                const file = files.find(f => f.id === currentFileId);
                
                if (!file) return;
                
                const filename = file.filename;
                const content = contentEl.value;
                
                // 保存时也记录当前位置
                saveCurrentPosition();
                
                try {
                    let result;
                    let newId = null;
                    
                    if (file.id.startsWith('new-')) {
                        result = await supabase
                            .from('text_files')
                            .insert([{
                                filename: filename,
                                content: content
                            }])
                            .select();
                    } else {
                        result = await supabase
                            .from('text_files')
                            .update({
                                content: content,
                                updated_at: new Date().toISOString()
                            })
                            .eq('id', currentFileId)
                            .select();
                    }
                    
                    const { data, error } = result;
                    
                    if (error) throw error;
                    
                    // 如果是新文件，需要把旧ID的书签和位置迁移到新ID
                    if (file.id.startsWith('new-') && data && data.length > 0) {
                        newId = data[0].id;
                        // 迁移书签
                        if (bookmarks[file.id]) {
                            bookmarks[newId] = bookmarks[file.id];
                            delete bookmarks[file.id];
                            saveBookmarksToStorage();
                        }
                        // 迁移位置记忆
                        try {
                            const oldKey = `textPosition_${file.id}`;
                            const oldPos = localStorage.getItem(oldKey);
                            if (oldPos) {
                                localStorage.setItem(`textPosition_${newId}`, oldPos);
                                localStorage.removeItem(oldKey);
                            }
                        } catch(e) {}
                    }
                    
                    // 保存前记住当前滚动位置
                    const savedScrollTop = contentEl.scrollTop;
                    const savedSelStart = contentEl.selectionStart;
                    const savedSelEnd = contentEl.selectionEnd;
                    
                    await loadFiles();
                    
                    if (newId) {
                        currentFileId = newId;
                        // selectFile会调用setReadMode，但我们保存后保持在阅读模式
                        renderFileList();
                        currentFilenameEl.textContent = filename;
                        contentEl.value = content;
                        updateCharCount();
                        // 保存完成后切换回阅读模式
                        setReadMode();
                        renderBookmarkList();
                        // 保持当前阅读位置
                        requestAnimationFrame(() => {
                            isRestoringPosition = true;
                            contentEl.scrollTop = savedScrollTop;
                            updateCursorInfo();
                            setTimeout(() => { isRestoringPosition = false; }, 100);
                        });
                    } else {
                        // 已有文件保存后也回到阅读模式
                        setReadMode();
                    }
                    
                    showNotification('文件保存成功，已返回阅读模式', 'success');
                } catch (error) {
                    console.error('保存文件失败:', error);
                    showNotification('保存失败: ' + error.message, 'error');
                }
            }
            
            async function deleteFile(fileId) {
                if (!confirm('确定要删除这个文件吗？此操作不可撤销。')) {
                    return;
                }
                
                try {
                    if (fileId.startsWith('new-')) {
                        files = files.filter(f => f.id !== fileId);
                        renderFileList();
                        if (currentFileId === fileId) {
                            currentFileId = null;
                            showEmptyEditor();
                        }
                        // 清理书签和位置
                        delete bookmarks[fileId];
                        saveBookmarksToStorage();
                        try { localStorage.removeItem(`textPosition_${fileId}`); } catch(e){}
                        showNotification('未保存的文件已删除', 'success');
                        return;
                    }
                    
                    const { error } = await supabase
                        .from('text_files')
                        .delete()
                        .eq('id', fileId);
                    
                    if (error) throw error;
                    
                    if (currentFileId === fileId) {
                        currentFileId = null;
                        showEmptyEditor();
                    }
                    
                    // 清理书签和位置
                    delete bookmarks[fileId];
                    saveBookmarksToStorage();
                    try { localStorage.removeItem(`textPosition_${fileId}`); } catch(e){}
                    
                    await loadFiles();
                    showNotification('文件删除成功', 'success');
                } catch (error) {
                    console.error('删除文件失败:', error);
                    showNotification('删除失败: ' + error.message, 'error');
                }
            }
            
            function showNotification(message, type = 'info') {
                notificationEl.textContent = message;
                notificationEl.className = `notification ${type}`;
                
                let icon = 'fas fa-info-circle';
                if (type === 'success') icon = 'fas fa-check-circle';
                if (type === 'error') icon = 'fas fa-exclamation-circle';
                if (type === 'warning') icon = 'fas fa-exclamation-triangle';
                
                notificationEl.innerHTML = `<i class="${icon}"></i> ${message}`;
                notificationEl.classList.add('show');
                
                setTimeout(() => {
                    notificationEl.classList.remove('show');
                }, 3000);
            }

            // ========== 侧边栏折叠 + 等比缩放文字（不改变折行） ==========
            // 核心思路：
            //   - editor-scaler 始终以"基准宽度 BASE_EDITOR_WIDTH"进行排版（textarea 宽度固定为此值）；
            //   - 侧边栏展开时视口较窄，缩放比 scale 较小 → 文字较小；
            //   - 侧边栏收起时视口变宽，缩放比 scale 变大 → 文字视觉上变大；
            //   - textarea 的 DOM 宽度始终不变，所以"一行显示哪些字符/折行点"完全不变，
            //     书签定位、阅读位置记忆都不会因为切换而错位。
            function setSidebarCollapsed(collapsed) {
                sidebarCollapsed = !!collapsed;
                if (sidebarCollapsed) {
                    sidebarEl.classList.add('collapsed');
                } else {
                    sidebarEl.classList.remove('collapsed');
                }
                requestAnimationFrame(() => {
                    updateEditorScale();
                });
                try {
                    localStorage.setItem('sidebarCollapsed', sidebarCollapsed ? '1' : '0');
                } catch(e) {}
            }

            function updateEditorScale() {
                if (!editorViewportEl || !editorScalerEl) return;
                const vpRect = editorViewportEl.getBoundingClientRect();
                const vpW = Math.max(320, vpRect.width);
                const vpH = Math.max(200, vpRect.height);
                const scale = vpW / BASE_EDITOR_WIDTH;
                const baseW = BASE_EDITOR_WIDTH;
                const baseH = vpH / scale;
                editorScalerEl.style.width = baseW + 'px';
                editorScalerEl.style.height = baseH + 'px';
                editorScalerEl.style.transform = 'scale(' + scale + ')';
                editorScalerEl._scale = scale;
                // 因为 textarea 的 clientWidth 始终等于基准排版宽度（不随缩放变化），
                // 测量镜像 syncMeasureMirrorStyle 读 clientWidth 时拿到的就是基准宽度，定位永远精确。
            }

            function setupEventListeners() {
                addFileBtnEl.addEventListener('click', createNewFile);
                saveBtnEl.addEventListener('click', saveFile);
                editModeBtnEl.addEventListener('click', toggleEditMode);
                searchInputEl.addEventListener('input', renderFileList);
                
                toggleSidebarEl.addEventListener('click', () => {
                    setSidebarCollapsed(!sidebarCollapsed);
                });
                
                mobileMenuBtnEl.addEventListener('click', () => {
                    setSidebarCollapsed(!sidebarCollapsed);
                });
                
                document.querySelector('.content-area').addEventListener('click', (e) => {
                    // 点击内容区时，若在移动端且侧边栏展开，自动收起
                    if (window.innerWidth <= 768 && !sidebarCollapsed && !e.target.closest('.sidebar')) {
                        setSidebarCollapsed(true);
                    }
                });

                // 窗口尺寸变化时重算缩放
                window.addEventListener('resize', () => {
                    updateEditorScale();
                });

                // 初次渲染：读取用户上次的侧边栏状态
                let initialCollapsed = false;
                try {
                    initialCollapsed = localStorage.getItem('sidebarCollapsed') === '1';
                } catch(e) {}
                setSidebarCollapsed(initialCollapsed);
                // 首次延迟一个事件循环，等布局稳定后再算缩放
                requestAnimationFrame(() => {
                    updateEditorScale();
                });
                
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                        e.preventDefault();
                        if (isEditMode && !saveBtnEl.disabled) {
                            saveFile();
                        } else if (!isEditMode && currentFileId) {
                            showNotification('当前为阅读模式，请先点击「编辑」按钮', 'warning');
                        }
                    }
                    // Ctrl+B 添加书签
                    if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
                        e.preventDefault();
                        // 如果书签面板没打开，先打开
                        if (!bookmarkPanelEl.classList.contains('open')) {
                            bookmarkPanelEl.classList.add('open');
                            bookmarkToggleEl.classList.add('active');
                            renderBookmarkList();
                        }
                        openAddBookmarkModal();
                    }
                    // Escape 键退出编辑模式
                    if (e.key === 'Escape' && isEditMode) {
                        setReadMode();
                    }
                });
            }
        })();
    </script>
</body>
</html>
