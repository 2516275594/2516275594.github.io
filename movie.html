<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<title>电影 · 影视地图</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101522;color:#fff;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.topbar{height:48px;position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:#151d2d;border-bottom:1px solid #ffffff18}
.brand{font-size:13px;font-weight:700;letter-spacing:.08em;color:#e8edfa}
.actions{display:flex;align-items:center;gap:8px}
a{color:#e8edfa;text-decoration:none;font-size:12px;padding:7px 11px;border:1px solid #ffffff25;border-radius:9px;background:#ffffff0b}
a:hover{background:#ffffff18}
main{height:calc(100% - 48px);width:100%}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
@media(max-width:520px){.topbar{height:44px;padding:0 10px}.brand{font-size:12px}main{height:calc(100% - 44px)}a{padding:6px 9px;font-size:11px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">电影 · 影视地图</div>
  <nav class="actions" aria-label="页面操作">
    <a href="./index.html">返回主页</a>
    <a href="https://www.sfeii.com/" target="_blank" rel="noopener noreferrer">新窗口打开</a>
  </nav>
</header>
<main>
  <iframe src="https://www.sfeii.com/" title="思菲影视地图" allow="fullscreen; autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</main>
</body>
</html>
